<style>

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eef4ff 0%,#f7f8fb 55%,#eef2f7 100%)}.login-card{width:min(440px,100%);padding:28px}.brand-row{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:20px;font-weight:950;flex:none;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.brand{font-size:22px;font-weight:950;letter-spacing:-.3px}.subtitle{margin:4px 0 0;color:var(--muted);font-size:13px}.login-card .stack{margin-top:22px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:800}.hint{padding:11px 12px;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-bottom:12px}.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}.topbar-meta{min-width:0}.topbar-meta .brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--success)}.top-actions{display:flex;gap:8px}

.bottom-nav{display:none}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 14px}.page-title{margin:0;font-size:24px;letter-spacing:-.4px}.page-sub{margin:4px 0 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{padding:16px}.stat .label{color:var(--muted);font-size:12px;font-weight:750}.stat .value{margin-top:6px;font-size:24px;line-height:1;font-weight:950}.stat .tiny{margin-top:6px;font-size:12px;color:var(--muted)}.section{padding:16px;margin-bottom:14px}.section h2,.section h3{margin:0 0 6px}.section p{margin:0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick .btn{min-height:62px}
.notice,.warning,.danger,.success{padding:12px 14px;border-radius:14px}.notice{border:1px solid #b2ddff;background:#eff8ff}.warning{border:1px solid #fedf89;background:#fffaeb}.danger{border:1px solid #fecdca;background:#fef3f2}.success{border:1px solid #abefc6;background:#ecfdf3}.notice strong,.warning strong,.danger strong,.success strong{display:block}
.sales-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.8fr);gap:14px;align-items:start}.panel{padding:14px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:10px}.search{position:relative}.search input{padding-left:42px}.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800;font-size:12px}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.product-btn{text-align:left;min-height:118px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.product-btn:hover{border-color:#98a2b3}.product-btn:disabled{background:#f8f9fb}.product-name{font-weight:900;line-height:1.15}.product-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}.product-price{font-size:20px;font-weight:950}.stock-tag{font-size:11px;color:var(--muted)}.low-stock{background:#fffaf0;border-color:#fedf89}.out-stock{opacity:.55}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:11px;font-weight:850}.badge.green{background:#ecfdf3;color:#027a48}.badge.orange{background:#fffaeb;color:#b54708}.badge.red{background:#fef3f2;color:#b42318}
.cart{position:sticky;top:72px}.cart-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.cart-items{margin-top:8px}.cart-empty{padding:30px 12px;text-align:center;color:var(--muted)}.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.cart-name{font-weight:800;line-height:1.2}.cart-sub{font-size:12px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:5px;margin-top:7px}.qty button{width:36px;min-width:36px;min-height:36px;padding:4px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:950}.cart-total{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.total-line{display:flex;justify-content:space-between;gap:10px;margin:6px 0}.total-big{font-size:31px;font-weight:950}.checkout{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.checkout .btn-primary{min-width:140px}
.table{display:grid}.table-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.table-row:last-child{border-bottom:0}.table-main{min-width:0}.table-title{font-weight:850;line-height:1.25}.table-sub{font-size:12px;color:var(--muted);margin-top:4px}.row-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-bottom:12px}.segmented{display:flex;gap:7px;flex-wrap:wrap}.segmented button{min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800}.segmented button.active{background:var(--ink);border-color:var(--ink);color:#fff}.kpi-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.bar{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden;margin-top:6px}.bar>span{display:block;height:100%;background:var(--primary);border-radius:99px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(3,7,18,.62);display:none;align-items:flex-end;justify-content:center;padding:0;z-index:100;pointer-events:none}.modal-backdrop.open{display:flex;pointer-events:auto}.modal{width:min(620px,100%);max-height:min(92vh,900px);overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.modal-head h2{margin:0;font-size:20px}.modal-body{display:grid;gap:12px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.close-btn{width:44px;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;font-size:18px;font-weight:900}.modal-note{padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:12px;color:var(--muted)}.logo-preview{width:72px;height:72px;border-radius:18px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:950;font-size:26px}.logo-preview img{width:100%;height:100%;object-fit:cover}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:250;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 10px 32px rgba(0,0,0,.25);max-width:min(520px,calc(100% - 28px));text-align:center;font-weight:750}.undo{position:fixed;left:12px;right:12px;bottom:14px;z-index:240;background:#fff;border:1px solid #b2ddff;border-radius:16px;padding:10px;box-shadow:0 16px 40px rgba(16,24,40,.18);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.undo-text{font-size:13px}.undo-text strong{display:block}.undo-btn{background:var(--primary);color:#fff;border:0;border-radius:12px;min-height:44px;padding:8px 14px;font-weight:900}
@media(min-width:760px){.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:22px}}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.sales-layout{grid-template-columns:1fr}.cart{position:static}.report-grid{grid-template-columns:1fr}}
@media(max-width:720px){.app-shell{padding:10px 10px 104px}.topbar{padding:10px 12px}.top-actions .btn-light{font-size:0;width:46px;padding:8px}.top-actions .btn-light:after{content:'↪';font-size:18px}.top-actions #logoutBtn{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:13px}.stat .value{font-size:21px}.page-title{font-size:21px}.grid-2,.report-grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product-btn{min-height:116px;padding:12px}.product-price{font-size:18px}.filters{grid-template-columns:1fr}.checkout{grid-template-columns:1fr}.checkout .btn-primary{min-width:0}.modal-actions{grid-template-columns:1fr 1fr}.bottom-nav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:10px;right:10px;bottom:10px;z-index:80;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:0 15px 45px rgba(16,24,40,.15)}.bottom-nav button{border:0;background:transparent;border-radius:12px;min-height:56px;font-weight:850;color:#475467}.bottom-nav button.active{background:var(--ink);color:#fff}.bottom-nav .nav-icon{display:block;font-size:17px}.bottom-nav .nav-label{display:block;font-size:10px;margin-top:3px}.row-actions{justify-content:flex-start}.table-row{grid-template-columns:1fr}.undo{bottom:86px}}
</style>
</head>
<body>
<section id="loginScreen" class="login-wrap">
  <div class="login-card card">
    <div class="brand-row"><div id="loginLogo" class="logo">GV</div><div><div id="loginBusinessName" class="brand">GestorVentas</div><div class="subtitle">Punto de venta offline</div></div></div>
    <div class="stack">
      <div class="field"><label>Usuario</label><input id="loginUser" autocomplete="username" placeholder="Escribe tu usuario"></div>
      <div class="field"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"></div>
      <button id="loginBtn" class="btn btn-primary btn-block">Entrar</button>
      <div id="loginHint" class="hint">Demo: dueño <b>dueno</b> / 1234 · trabajador <b>trabajador</b> / 1111.</div>
    </div>
  </div>
</section>
<section id="appScreen" class="app-shell hidden">
  <header class="topbar card"><div class="topbar-left"><div id="appLogo" class="logo">GV</div><div class="topbar-meta"><div id="appStoreName" class="brand">Mi Tienda</div><div class="role-pill"><span class="dot"></span><span id="appUser"></span></div></div></div><div class="top-actions"><button id="lockBtn" class="btn btn-light">Bloquear</button><button id="logoutBtn" class="btn btn-light">Salir</button></div></header>
  <nav id="topNav" class="nav"></nav>
  <main id="page"></main>
</section>
<nav id="bottomNav" class="bottom-nav hidden"></nav>
<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="undoBar" class="undo hidden"></div>
<script>
'use strict';
const VERSION=31, DB_KEY='gestorventas_db_v31', LEGACY=['gestorventas_db_v30','gv_v22','gv_v2'], UNDO_SECONDS=15;
const S={db:null,user:null,tab:'home',cart:[],saleSearch:'',category:'Todas',inventorySearch:'',inventoryFilter:'all',reportRange:'today',undo:null,undoTimer:null,toastTimer:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>new Date(); const iso=()=>now().toISOString();
function dateKey(d=now()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtDate(v){return new Date(v).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}
function num(v){const n=Number(v);return Number.isFinite(n)?n:NaN}
function money(v){return `${S.db?.store?.currency||'$'}${Number(v||0).toFixed(2)}`}
function base(){return {version:VERSION,store:{name:'Mi Tienda',businessType:'Tienda',currency:'$',phone:'',address:'',logo:''},users:[{id:'owner',name:'Dueño',username:'dueno',pin:'1234',role:'owner',active:true},{id:'worker-demo',name:'Trabajador',username:'trabajador',pin:'1111',role:'worker',active:true}],products:[{id:'p1',name:'Refresco',category:'Bebidas',cost:.70,price:1.50,stock:50,min:10,active:true},{id:'p2',name:'Cigarro',category:'Otros',cost:3,price:5,stock:30,min:5,active:true},{id:'p3',name:'Picadillo',category:'Comida',cost:2,price:3.50,stock:25,min:5,active:true}],sales:[],closures:[],inventoryCounts:[],cashMovements:[],audit:[],cash:{open:false,sessionId:null,opening:0,openedAt:null,openedBy:null}}}
function clean(d){const b=base(),x=(d&&typeof d==='object')?d:{};b.store={...b.store,...(x.store||{})};b.store.name=String(b.store.name||'Mi Tienda');b.store.businessType=String(b.store.businessType||'Tienda');b.store.currency=String(b.store.currency||'$');b.store.phone=String(b.store.phone||'');b.store.address=String(b.store.address||'');b.store.logo=typeof b.store.logo==='string'?b.store.logo:'';
 b.users=Array.isArray(x.users)?x.users.map(u=>({...u,id:u.id||uid('U'),name:String(u.name||u.username||'Usuario'),username:String(u.username||''),pin:String(u.pin||''),role:u.role==='owner'?'owner':'worker',active:u.active!==false})).filter(u=>u.username&&u.pin):b.users; if(!b.users.some(u=>u.role==='owner'))b.users.unshift({...base().users[0]});
 b.products=Array.isArray(x.products)?x.products.map(p=>({...p,id:p.id||uid('P'),name:String(p.name||'Producto'),category:String(p.category||'General'),cost:num(p.cost)||0,price:num(p.price)||0,stock:Math.max(0,Math.floor(num(p.stock)||0)),min:Math.max(0,Math.floor(num(p.min)||0)),active:p.active!==false})):b.products;
 b.sales=Array.isArray(x.sales)?x.sales.map(s=>({...s,id:s.id||uid('S'),at:s.at||iso(),dateKey:s.dateKey||dateKey(new Date(s.at||Date.now())),userId:s.userId||'',userName:s.userName||'Usuario',payment:s.payment||'Efectivo',total:num(s.total)||0,received:num(s.received)||0,change:num(s.change)||0,cashSessionId:s.cashSessionId||null,voided:s.voided===true,voidedAt:s.voidedAt||null,voidedBy:s.voidedBy||null,items:Array.isArray(s.items)?s.items.map(i=>({...i,qty:Math.max(1,Math.floor(num(i.qty)||1)),price:num(i.price)||0,cost:num(i.cost)||0})):[]})):[];
 b.closures=Array.isArray(x.closures)?x.closures:[];b.inventoryCounts=Array.isArray(x.inventoryCounts)?x.inventoryCounts:[];b.cashMovements=Array.isArray(x.cashMovements)?x.cashMovements:[];b.audit=Array.isArray(x.audit)?x.audit.slice(-1500):[];b.cash=x.cash&&typeof x.cash==='object'?{...base().cash,...x.cash}:{...base().cash};b.version=VERSION;return b}
function load(){try{const raw=localStorage.getItem(DB_KEY);if(raw)S.db=clean(JSON.parse(raw));else{let legacy=null;for(const k of LEGACY){try{const r=localStorage.getItem(k);if(r){legacy=JSON.parse(r);break}}catch(e){}}S.db=clean(legacy||base());save();}}catch(e){S.db=base();try{save()}catch(_){}}}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(S.db));return true}catch(e){toast('No se pudo guardar en este dispositivo');return false}}
function audit(action,detail=''){S.db.audit.push({id:uid('A'),at:iso(),userId:S.user?.id||'',userName:S.user?.name||'Sistema',action,detail});S.db.audit=S.db.audit.slice(-1500)}
function isOwner(){return S.user?.role==='owner'}
function activeProducts(){return S.db.products.filter(p=>p.active)}
function initials(n){return String(n||'GV').split(/\s+/).map(x=>x[0]).join('').toUpperCase().slice(0,2)||'GV'}
function updateBrand(){const name=S.db.store.name,logo=S.db.store.logo;for(const id of ['loginLogo','appLogo']){const n=$(id);if(!n)continue;n.innerHTML=logo?`<img src="${esc(logo)}" alt="">`:esc(initials(name))} $('loginBusinessName').textContent=name;$('appStoreName').textContent=name}
function navItems(){return isOwner()?[['home','⌂','Inicio'],['sale','▦','Venta'],['inv','▤','Inventario'],['cash','▣','Caja'],['reports','◒','Reportes'],['admin','⚙','Admin']]:[['home','⌂','Inicio'],['sale','▦','Venta'],['cash','▣','Caja']]}
function renderNav(){const html=navItems().map(x=>`<button data-nav="${x[0]}"><span class="nav-icon">${x[1]}</span><span class="nav-label">${x[2]}</span></button>`).join('');for(const nav of [$('topNav'),$('bottomNav')]){nav.innerHTML=html;nav.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)))}markNav()}
function markNav(){for(const nav of [$('topNav'),$('bottomNav')])nav.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===S.tab))}
function go(tab){S.tab=tab;markNav();const fn={home:home,sale:sale,inv:inventory,cash:cash,reports:reports,admin:admin}[tab]||home;fn()}
function showApp(){ $('loginScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');$('bottomNav').classList.remove('hidden');$('appUser').textContent=`${S.user.name} · ${isOwner()?'Dueño':'Trabajador'}`;updateBrand();renderNav();go('home')}
function showLogin(msg){S.user=null;S.cart=[];$('appScreen').classList.add('hidden');$('bottomNav').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('loginUser').value='';$('loginPin').value='';updateBrand();$('loginHint').textContent=`Demo: dueño dueno / 1234 · trabajador trabajador / 1111.`;if(msg)toast(msg);setTimeout(()=>$('loginUser').focus(),60)}
function login(){const u=$('loginUser').value.trim(),p=$('loginPin').value.trim(),found=S.db.users.find(x=>x.active&&x.username.toLowerCase()===u.toLowerCase()&&x.pin===p);if(!found)return toast('Usuario o PIN incorrecto');S.user=found;audit('inicio_sesion');save();showApp()}
function logout(){if(S.cart.length)return confirmBox('Salir de la venta','Hay productos en el pedido. ¿Salir y perder este pedido?','Salir',()=>{audit('cierre_sesion');save();showLogin()});audit('cierre_sesion');save();showLogin()}
function lock(){const u=S.user;showLogin();if(u){$('loginUser').value=u.username;$('loginPin').value='';$('loginHint').textContent='Sesión bloqueada. Escribe tu PIN para continuar.';$('loginPin').focus()}}

function sale(){if(!S.db.cash.open){$('page').innerHTML=`<div class="page-head"><div><h1 class="page-title">Venta</h1><p class="page-sub">Venta rápida y directa.</p></div></div><section class="warning card section"><strong>Abre la caja para comenzar</strong><p class="sm muted" style="margin-top:4px">La venta quedará asociada a la sesión de caja actual.</p><button id="saleOpen" class="btn btn-primary" style="margin-top:10px">Abrir caja</button></section>`;$('saleOpen').addEventListener('click',openCash);return}if(!S.category)S.category='Todas';const cats=['Todas',...Array.from(new Set(activeProducts().map(p=>p.category||'General'))).sort((a,b)=>a.localeCompare(b,'es'))];if(!cats.includes(S.category))S.category='Todas';const list=activeProducts().filter(p=>(S.category==='Todas'||p.category===S.category)&&p.name.toLowerCase().includes(S.saleSearch.toLowerCase()));const total=cartTotal();$('page').innerHTML=`<div class="page-head"><div><h1 class="page-title">Nueva venta</h1><p class="page-sub">Toca un producto para agregar 1 unidad.</p></div><span class="badge green">Caja abierta</span></div><div class="sales-layout"><section class="card panel"><div class="toolbar"><div class="search"><span class="search-icon">⌕</span><input id="saleSearch" value="${esc(S.saleSearch)}" placeholder="Buscar producto…" autocomplete="off"></div><button id="clearSaleSearch" class="btn btn-light">Limpiar</button></div><div class="chips">${cats.map(c=>`<button class="chip ${c===S.category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="product-grid">${list.length?list.map(p=>`<button class="product-btn ${p.stock<=p.min?'low-stock':''} ${p.stock<=0?'out-stock':''}" data-add="${esc(p.id)}" ${p.stock<=0?'disabled':''}><div><div class="product-name">${esc(p.name)}</div><div class="stock-tag">${p.stock<=0?'Agotado':`Stock ${p.stock}`}</div></div><div class="product-meta"><span class="product-price money">${money(p.price)}</span><span class="badge">+1</span></div><  $('saleSearch').addEventListener('input',e=>{S.saleSearch=e.target.value;sale();setTimeout(()=>{const x=$('saleSearch');x?.focus();x?.setSelectionRange(x.value.length,x.value.length)},0)});$('clearSaleSearch').addEventListener('click',()=>{S.saleSearch='';sale()});$('page').querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{S.category=b.dataset.cat;sale()}));$('page').querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>addCart(b.dataset.add)));$('clearCart').addEventListener('click',()=>{if(!S.cart.length)return;confirmBox('Vaciar pedido','Se quitarán todos los productos de la venta actual.','Vaciar',()=>{S.cart=[];sale()})});$('cancelOrder').addEventListener('click',()=>{S.cart=[];sale()});$('checkout').addEventListener('click',checkout);$('page').querySelectorAll('[data-qty]').forEach(b=>b.addEventListener('click',()=>qty(b.dataset.id,b.dataset.qty)))}
function cartUnits(){return S.cart.reduce((a,i)=>a+i.qty,0)}function cartTotal(){return S.cart.reduce((a,i)=>a+i.price*i.qty,0)}
function addCart(id){const p=S.db.products.find(p=>p.id===id&&p.active);if(!p||p.stock<=0)return toast('Producto sin existencias');const item=S.cart.find(i=>i.productId===id),next=(item?.qty||0)+1;if(next>p.stock)return toast(`Solo quedan ${p.stock} unidades`);if(item)item.qty=next;else S.cart.push({productId:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});sale()}
function qty(id,op){const i=S.cart.find(i=>i.productId===id);if(!i)return;const p=S.db.products.find(p=>p.id===id);if(op==='plus'){if(i.qty>=p.stock)return toast(`Solo quedan ${p.stock} unidades`);i.qty++}else if(op==='minus'){i.qty--;if(i.qty<=0)S.cart=S.cart.filter(x=>x.productId!==id)}else S.cart=S.cart.filter(x=>x.productId!==id);sale()}
function checkout(){const total=cartTotal();if(!total||!S.cart.length)return;for(const i of S.cart){const p=S.db.products.find(p=>p.id===i.productId);if(!p||p.stock<i.qty)return toast(`Stock insuficiente: ${i.name}`)}openModal('Cobrar venta',`<div class="modal-note">${cartUnits()} ${cartUnits()===1?'unidad':'unidades'} · Total <b>${money(total)}</b></div><div class="field"><label>Método de pago</label><select id="pay"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Otro</option></select></div><div id="receivedWrap" class="field"><label>Efectivo recibido</label><input id="received" type="number" min="0" step="0.01" inputmode="decimal" value="${total.toFixed(2)}"></div><div id="changeBox" class="success"><div class="sm">Cambio</div><div id="change" class="total-big money">${money(0)}</div></div>`,`Registrar venta`,()=>finishSale(total));const update=()=>{const cash=$('pay').value==='Efectivo';$('receivedWrap').classList.toggle('hidden',!cash);$('changeBox').classList.toggle('hidden',!cash);if(cash){const received=num($('received').value)||0;$('change').textContent=money(Math.max(0,received-total))}};$('pay').addEventListener('change',update);$('received').addEventListener('input',update);$('received').addEventListener('keydown',e=>{if(e.key==='Enter')$('modalPrimary').click()});update()}
function finishSale(total){const payment=$('pay').value,received=payment==='Efectivo'?(num($('received').value)||0):0;if(payment==='Efectivo'&&received<total)return toast(`Faltan ${money(total-received)}`);for(const i of S.cart){const p=S.db.products.find(p=>p.id===i.productId);if(!p||p.stock<i.qty)return toast(`Stock insuficiente: ${i.name}`)}const s={id:uid('S'),at:iso(),dateKey:dateKey(),userId:S.user.id,userName:S.user.name,payment,total,received,change:payment==='Efectivo'?received-total:0,cashSessionId:S.db.cash.sessionId,voided:false,voidedAt:null,voidedBy:null,items:S.cart.map(i=>({...i}))};S.db.sales.push(s);S.cart.forEach(i=>{S.db.products.find(p=>p.id===i.productId).stock-=i.qty});audit('venta_registrada',`${s.id} · ${money(s.total)} · ${payment}`);save();closeModal();S.cart=[];setUndo(s);sale();toast(`Venta registrada · ${money(s.total)}`)}
function setUndo(s){clearTimeout(S.undoTimer);S.undo=s;renderUndo();S.undoTimer=setTimeout(()=>{S.undo=null;renderUndo()},UNDO_SECONDS*1000)}
function renderUndo(){const b=$('undoBar');if(!S.undo){b.classList.add('hidden');b.innerHTML='';return}b.classList.remove('hidden');b.innerHTML=`<div class="undo-text"><strong>Venta ${esc(S.undo.id)} registrada</strong><span>Deshacer disponible durante ${UNDO_SECONDS} segundos.</span></div><button id="undoBtn" class="undo-btn">DESHACER</button>`;$('undoBtn').addEventListener('click',undo)}
function undo(){if(!S.undo)return;const s=S.db.sales.find(x=>x.id===S.undo.id&&!x.voided);if(!s)return;for(const i of s.items){const p=S.db.products.find(p=>p.id===i.productId);if(p)p.stock+=i.qty}s.voided=true;s.voidedAt=iso();s.voidedBy=S.user.name;audit('venta_deshacida',`${s.id} · ${money(s.total)}`);save();clearTimeout(S.undoTimer);S.undo=null;renderUndo();sale();toast('Venta deshecha; stock restaurado')}
function openCash(){openModal('Abrir caja',`<div class="modal-note">El fondo inicial forma parte del efectivo esperado del cierre.</div><div class="field"><label>Fondo inicial</label><input id="opening" type="number" min="0" step="0.01" inputmode="decimal" value="0"></div>`,`Abrir caja`,()=>doOpenCash())}
function doOpenCash(){const v=num($('opening').value)||0;if(v<0)return toast('Fondo inválido');if(S.db.cash.open)return toast('La caja ya está abierta');S.db.cash={open:true,sessionId:uid('CS'),opening:v,openedAt:iso(),openedBy:S.user.name};audit('caja_abierta',`Fondo ${money(v)}`);save();closeModal();go(S.tab==='sale'?'sale':'cash');toast('Caja abierta')}
function sessionSales(){return S.db.sales.filter(s=>s.cashSessionId===S.db.cash.sessionId&&!s.voided)}
function cashTotals(){const ss=sessionSales(),mov=S.db.cashMovements.filter(m=>m.sessionId===S.db.cash.sessionId);const cash=ss.filter(s=>s.payment==='Efectivo').reduce((a,s)=>a+s.total,0),card=ss.filter(s=>s.payment==='Tarjeta').reduce((a,s)=>a+s.total,0),transfer=ss.filter(s=>s.payment==='Transferencia').reduce((a,s)=>a+s.total,0),other=ss.filter(s=>s.payment==='Otro').reduce((a,s)=>a+s.total,0),inCash=mov.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),outCash=mov.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0);return {ss,cash,card,transfer,other,inCash,outCash,expected:(S.db.cash.opening||0)+cash+inCash-outCash}}
function cash(){const open=S.db.cash.open,n=open?cashTotals():{cash:0,card:0,transfer:0,other:0,inCash:0,outCash:0,expected:0,ss:[]};$('page').innerHTML=`<div class="page-head"><div><h1 class="page-title">Caja</h1><p class="page-sub">Fondo, cobros, movimientos y cierre.</p></div>${open?'<span class="badge green">Sesión abierta</span>':'<span class="badge orange">Sesión cerrada</span>'}</div>${open?`<div class="stats"><div class="stat card"><div class="label">Fondo inicial</div><div class="value money">${money(S.db.cash.opening)}</div></div><div class="stat card"><div class="label">Efectivo vendido</div><div class="value money">${money(n.cash)}</div></div><div class="stat card"><div class="label">Movimientos</div><div class="value money">${money(n.inCash-n.outCash)}</div></div><div class="stat card"><div class="label">Esperado</div><div class="value money">${money(n.expected)}</div></div></div><div class="grid-2"><section class="card section"><h2>Pagos de la sesión</h2><div class="kpi-line"><span>Efectivo</span><b class="money">${money(n.cash)}</b></div><div class="kpi-line"><span>Tarjeta</span><b class="money">${money(n.card)}</b></div><div class="kpi-line"><span>Transferencia</span><b class="money">${money(n.transfer)}</b></div><div class="kpi-line"><span>Otro</span><b class="money">${money(n.other)}</b></div></section><section class="card section"><h2>Movimiento de efectivo</h2><div class="actions"><button id="cashIn" class="btn btn-success">+ Entrada</button><button id="cashOut" class="btn btn-warning">− Salida</button></div><div class="table" style="margin-top:10px">${S.db.cashMovements.filter(m=>m.sessionId===S.db.cash.sessionId).slice().reverse().slice(0,8).map(m=>`<div class="table-row"><div><div class="table-title">${m.type==='in'?'Entrada':'Salida'} · ${money(m.amount)}</div><div class="table-sub">${fmtDate(m.at)} · ${esc(m.reason)}</div></div><span class="badge ${m.type==='in'?'green':'orange'}">${m.type==='in'?'+':'−'}</span></div>`).join('')||'<div class="empty">Sin movimientos manuales.</div>'}</div></section></div><section class="card section"><h2>Cerrar caja</h2><p class="sm muted">Esperado = fondo + ventas en efectivo + entradas − salidas.</p><div class="success" style="margin-top:10px"><div class="sm">Efectivo esperado</div><div class="total-big money">${money(n.expected)}</div></div><button id="closeCash" class="btn btn-danger btn-block" style="margin-top:10px">Cerrar caja</button></section>`:`<section class="warning card section"><h2>Caja cerrada</h2><p class="sm muted" style="margin-top:4px">Abre la sesión para comenzar la jornada.</p><button id="openCash" class="btn btn-primary" style="margin-top:10px">Abrir caja</button></section>`}${isOwner()?`<section class="card section"><h3>Historial de cierres</h3><div class="table">${S.db.closures.slice().reverse().slice(0,15).map(c=>`<div class="table-row"><div><div class="table-title">${fmtDate(c.closedAt)} · ${esc(c.closedBy)}</div><div class="table-sub">Esperado ${money(c.expected)} · Contado ${money(c.counted)}</div></div><span class="badge ${Math.abs(c.difference)<.005?'green':c.difference>0?'orange':'red'}">${c.difference>=0?'+':''}${money(c.difference)}</span></div>`).join('')||'<div class="empty">Todavía no hay cierres.</div>'}</div></section>`:''}`;if(open){$('cashIn').addEventListener('click',()=>cashMove('in'));$('cashOut').addEventListener('click',()=>cashMove('out'));$('closeCash').addEventListener('click',()=>closeCash(n.expected))}else $('openCash').addEventListener('click',openCash)}
function cashMove(type){openModal(type==='in'?'Entrada de efectivo':'Salida de efectivo',`<div class="field"><label>Monto</label><input id="moveAmount" type="number" min="0.01" step="0.01" inputmode="decimal"></div><div class="field"><label>Motivo</label><input id="moveReason" placeholder="Ej. cambio, compra, retiro…"></div>`,`Registrar`,()=>saveMove(type))}
function saveMove(type){const amount=num($('moveAmount').value),reason=$('moveReason').value.trim();if(!(amount>0)||!reason)return toast('Escribe monto y motivo');const t=cashTotals();if(type==='out'&&amount>t.expected)return toast(`No puedes retirar más de ${money(t.expected)}`);S.db.cashMovements.push({id:uid('CM'),sessionId:S.db.cash.sessionId,type,amount,reason,at:iso(),userId:S.user.id,userName:S.user.name});audit(type==='in'?'entrada_caja':'salida_caja',`${money(amount)} · ${reason}`);save();closeModal();cash();toast('Movimiento registrado')}
function closeCash(expected){openModal('Cerrar caja',`<div class="modal-note">Efectivo esperado: <b>${money(expected)}</b></div><div class="field"><label>Efectivo contado</label><input id="counted" type="number" min="0" step="0.01" inputmode="decimal"></div><div id="diffBox" class="success"><div class="sm">Diferencia</div><div id="diff" class="total-big money">${money(0)}</div></div>`,`Registrar cierre`,()=>doCloseCash(expected));$('counted').addEventListener('input',()=>{const d=(num($('counted').value)||0)-expected;$('diffBox').className=d===0?'success':d>0?'warning':'danger';$('diff').textContent=(d>=0?'+':'')+money(d)})}
function doCloseCash(expected){const counted=num($('counted').value);if(!(counted>=0))return toast('Escribe el efectivo contado');const diff=counted-expected,sessionId=S.db.cash.sessionId;S.db.closures.push({id:uid('CC'),sessionId,openedAt:S.db.cash.openedAt,openedBy:S.db.cash.openedBy,closedAt:iso(),closedBy:S.user.name,opening:S.db.cash.opening,expected,counted,difference:diff});audit('caja_cerrada',`Esperado ${money(expected)} · Contado ${money(counted)} · Dif ${money(diff)}`);S.db.cash={open:false,sessionId:null,opening:0,openedAt:null,openedBy:null};save();closeModal();cash();toast('Cierre registrado')}
function inventory(){if(!isOwner())return go('home');const list=S.db.products.filter(p=>{const q=S.inventorySearch.toLowerCase();const text=(p.name+' '+p.category).toLowerCase();const baseMatch=!q||text.includes(q);const f=S.inventoryFilter==='low'?(p.active&&p.stock<=p.min):S.inventoryFilter==='inactive'?!p.active:true;return baseMatch&&f});$('page').innerHTML=`<div class="page-head"><div><h1 class="page-title">Inventario</h1><p class="page-sub">Productos, existencias, mínimos y ajustes registrados.</p></div><div class="actions"><button id="newProduct" class="btn btn-primary">+ Producto</button><button id="countInventory" class="btn btn-light">Conteo físico</button></div></div><div class="stats"><div class="stat card"><div class="label">Productos</div><div class="value">${S.db.products.length}</div></div><div class="stat card"><div class="label">Activos</div><div class="value">${activeProducts().length}</div></div><div class="stat card"><div class="label">Stock bajo</div><div class="value">${activeProducts().filter(p=>p.stock<=p.min).length}</div></div><div class="stat card"><div class="label">Valor al costo</div><div class="value money">${money(activeProducts().reduce((a,p)=>a+p.cost*p.stock,0))}</div></div></div><section class="card section"><div class="filters"><input id="inventorySearch" value="${esc(S.inventorySearch)}" placeholder="Buscar producto o categoría…"><select id="inventoryFilter"><option value="all" ${S.inventoryFilter==='all'?'selected':''}>Todos</option><option value="low" ${S.inventoryFilter==='low'?'selected':''}>Stock bajo</option><option value="inactive" ${S.inventoryFilter==='inactive'?'selected':''}>Inactivos</option></select><button id="inventoryClear" class="btn btn-light">Limpiar</button></div><div class="table">${list.map(p=>`<div class="table-row"><div><div class="table-title">${esc(p.name)} ${p.active?'':'<span class="badge red">Inactivo</span>'}</div><div class="table-sub">${esc(p.category)} · Venta ${money(p.price)} · Costo ${money(p.cost)} · Stock ${p.stock} · Mín ${p.min}</div></div><div class="row-actions"><button class="btn btn-light" data-edit="${esc(p.id)}" type="button">Editar</button><button class="btn btn-soft" data-stock="${esc(p.id)}" type="button">Ajustar stock</button><button class="btn btn-danger" data-delete-product="${esc(p.id)}" type="button">Eliminar</button></div></div>`).join('')||'<div class="empty">No hay productos para este filtro.</div>'}</div></section><section class="card section"><h3>Últimos movimientos de inventario</h3><div class="table">${S.db.audit.filter(a=>['stock_ajustado','conteo_inventario','producto_creado','producto_editado'].includes(a.action)).slice().reverse().slice(0,15).map(a=>`<div class="table-row"><div><div class="table-title">${esc(a.action)}</div><div class="table-sub">${fmtDate(a.at)} · ${esc(a.userName)}${a.detail?' · '+esc(a.detail):''}</div></div></div>`).join('')||'<div class="empty">Sin movimientos.</div>'}</div></section>`;$('newProduct').addEventListener('click',()=>productModal());$('countInventory').addEventListener('click',inventoryCount);$('inventorySearch').addEventListener('input',e=>{S.inventorySearch=e.target.value;inventory()});$('inventoryFilter').addEventListener('change',e=>{S.inventoryFilter=e.target.value;inventory()});$('inventoryClear').addEventListener('click',()=>{S.inventorySearch='';S.inventoryFilter='all';inventory()});$('page').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>productModal(b.dataset.edit)));$('page').querySelectorAll('[data-stock]').forEach(b=>b.addEventListener('click',()=>stockAdjust(b.dataset.stock)));$('page').querySelectorAll('[data-delete-product]').forEach(b=>b.addEventListener('click',()=>confirmDeleteProduct(b.dataset.deleteProduct)))}
function productModal(id){const p=id?S.db.products.find(x=>x.id===id):{name:'',category:'General',cost:0,price:0,stock:0,min:0,active:true};if(!p)return;const history=S.db.sales.filter(s=>s.items?.some(i=>i.productId===p.id)).length;openModal(id?'Editar producto':'Nuevo producto',`<div class="grid-2"><div class="field"><label>Nombre</label><input id="pName" value="${esc(p.name)}" autocomplete="off"></div><div class="field"><label>Categoría</label><input id="pCat" value="${esc(p.category||'General')}" autocomplete="off"></div></div><div class="grid-2"><div class="field"><label>Costo</label><input id="pCost" type="number" min="0" step="0.01" inputmode="decimal" value="${p.cost}"></div><div class="field"><label>Precio de venta</label><input id="pPrice" type="number" min="0" step="0.01" inputmode="decimal" value="${p.price}"></div></div><div class="grid-2"><div class="field"><label>${id?'Stock actual':'Stock inicial'}</label><input id="pStock" type="number" min="0" step="1" inputmode="numeric" value="${p.stock}"></div><div class="field"><label>Stock mínimo</label><input id="pMin" type="number" min="0" step="1" inputmode="numeric" value="${p.min}"></div></div><label style="display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800"><input id="pActive" type="checkbox" style="width:20px;min-height:20px" ${p.active!==false?'checked':''}> Producto activo</label>${id?`<div class="modal-note">Este producto tiene ${history} ${history===1?'venta histórica':'ventas históricas'}. Al eliminarlo, esas operaciones permanecen en el historial.</div><button id="deleteProduct" class="btn btn-danger btn-block" type="button">Eliminar producto definitivamente</button>`:'<div class="modal-note">Puedes editar el stock aquí. Para un cambio de inventario con motivo usa <b>Ajustar stock</b>.</div>'}`,id?'Guardar cambios':'Crear producto',()=>saveProduct(id));if(id)$('deleteProduct').addEventListener('click',()=>confirmDeleteProduct(id))}
function saveProduct(id){const name=$('pName').value.trim(),category=$('pCat').value.trim()||'General',cost=num($('pCost').value),price=num($('pPrice').value),stock=num($('pStock').value),min=num($('pMin').value),active=$('pActive').checked;if(!name||!(cost>=0)||!(price>=0)||!(stock>=0)||!(min>=0))return toast('Completa todos los datos del producto');if(!Number.isInteger(stock)||!Number.isInteger(min))return toast('Stock y mínimo deben ser números enteros');if(id){const p=S.db.products.find(x=>x.id===id);if(!p)return toast('Producto no encontrado');const oldStock=p.stock;p.name=name;p.category=category;p.cost=cost;p.price=price;p.stock=stock;p.min=min;p.active=active;audit('producto_editado',`${name} · ${money(price)}${oldStock!==stock?' · stock '+oldStock+' → '+stock:''}`);save();closeModal();inventory();toast('Producto actualizado')}else{S.db.products.push({id:uid('P'),name,category,cost,price,stock,min,active});audit('producto_creado',`${name} · stock ${stock}`);save();closeModal();inventory();toast('Producto creado')}}
function confirmDeleteProduct(id){const p=S.db.products.find(x=>x.id===id);if(!p)return;const history=S.db.sales.filter(s=>s.items?.some(i=>i.productId===id)).length;const inCart=S.cart.some(i=>i.productId===id);openConfirm('Eliminar producto',`<b>${esc(p.name)}</b><br><br>Se eliminará del catálogo y dejará de aparecer en nuevas ventas. El stock actual (${p.stock}) también dejará de existir en inventario. Las ${history} ${history===1?'venta histórica':'ventas históricas'} conservarán sus datos.<br>${inCart?'<br><span class="danger"><b>Está en el pedido actual.</b> Ese pedido se cancelará para evitar inconsistencias.</span>':''}<br><br>Esta acción no se puede deshacer salvo restaurando un respaldo.`,'Eliminar',()=>deleteProductNow(id),true)}
function deleteProductNow(id){const idx=S.db.products.findIndex(x=>x.id===id);if(idx<0)return false;const p=S.db.products[idx];S.db.products.splice(idx,1);S.cart=S.cart.filter(i=>i.productId!==id);audit('producto_eliminado',`${p.name} · id ${p.id}`);save();closeModal();inventory();toast('Producto eliminado');return true}
function stockAdjust(id){const p=S.db.products.find(x=>x.id===id);if(!p)return;openModal('Ajustar stock',`<div class="notice"><strong>${esc(p.name)}</strong><div class="sm muted" style="margin-top:4px">Stock actual: <b>${p.stock}</b></div></div><div class="field"><label>Nuevo stock</label><input id="newStock" type="number" min="0" step="1" value="${p.stock}"></div><div class="field"><label>Motivo</label><select id="stockReason"><option>Recepción de mercancía</option><option>Ajuste por conteo</option><option>Merma</option><option>Corrección</option><option>Otro</option></select></div><div class="field"><label>Nota</label><input id="stockNote" placeholder="Opcional"></div>`,`Guardar ajuste`,()=>saveStock(id))}
function saveStock(id){const p=S.db.products.find(x=>x.id===id),v=num($('newStock').value),r=$('stockReason').value,n=$('stockNote').value.trim();if(!p||!(v>=0))return toast('Stock inválido');const old=p.stock;p.stock=Math.floor(v);audit('stock_ajustado',`${p.name} · ${old} → ${p.stock} · ${r}${n?' · '+n:''}`);save();closeModal();inventory();toast('Stock actualizado')}
function inventoryCount(){const ps=activeProducts();openModal('Conteo físico',`<div class="modal-note">Cuenta físicamente las existencias. Al registrar se ajustará el stock al valor contado y se guardará la diferencia.</div><div class="table">${ps.map(p=>`<div class="table-row" style="grid-template-columns:minmax(0,1fr)110px"><div><div class="table-title">${esc(p.name)}</div><div class="table-sub">Teórico: ${p.stock}</div></div><input data-count="${esc(p.id)}" type="number" min="0" step="1" value="${p.stock}"></div>`).join('')||'<div class="empty">No hay productos activos.</div>'}</div>`,`Registrar conteo`,saveCount)}
function saveCount(){const items=[];$('modal').querySelectorAll('[data-count]').forEach(i=>{const p=S.db.products.find(x=>x.id===i.dataset.count),v=num(i.value);if(p&&v>=0)items.push({productId:p.id,name:p.name,theoretical:p.stock,physical:Math.floor(v),difference:Math.floor(v)-p.stock})});if(!items.length)return toast('No hay conteos válidos');items.forEach(x=>{S.db.products.find(p=>p.id===x.productId).stock=x.physical});S.db.inventoryCounts.push({id:uid('IC'),at:iso(),userId:S.user.id,userName:S.user.name,items});audit('conteo_inventario',`${items.length} productos contabilizados`);save();closeModal();inventory();toast('Conteo registrado')}
function reports(){if(!isOwner())return go('home');const list=filteredSales(),active=list.filter(s=>!s.voided),revenue=active.reduce((a,s)=>a+s.total,0),cost=active.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0),profit=revenue-cost,units=active.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0),avg=active.length?revenue/active.length:0;const pays=['Efectivo','Tarjeta','Transferencia','Otro'].map(p=>[p,active.filter(s=>s.payment===p).reduce((a,s)=>a+s.total,0)]);const workers=Array.from(new Set(active.map(s=>s.userName))).map(n=>[n,active.filter(s=>s.userName===n).reduce((a,s)=>a+s.total,0)]).sort((a,b)=>b[1]-a[1]);const pm={};active.forEach(s=>s.items.forEach(i=>{pm[i.productId]??={name:i.name,qty:0,total:0};pm[i.productId].qty+=i.qty;pm[i.productId].total+=i.qty*i.price}));const top=Object.values(pm).sort((a,b)=>b.total-a.total).slice(0,8);$('page').innerHTML=`<div class="page-head"><div><h1 class="page-title">Reportes</h1><p class="page-sub">Ventas, pagos, productos y rendimiento.</p></div><div class="actions"><button id="csv" class="btn btn-light">Exportar CSV</button></div></div><section class="card section"><div class="segmented"><button data-range="today" class="${S.reportRange==='today'?'active':''}">Hoy</button><button data-range="7" class="${S.reportRange==='7'?'active':''}">7 días</button><button data-range="30" class="${S.reportRange==='30'?'active':''}">30 días</button><button data-range="all" class="${S.reportRange==='all'?'active':''}">Todo</button></div></section><div class="stats"><div class="stat card"><div class="label">Ventas</div><div class="value money">${money(revenue)}</div><div class="tiny">${active.length} operaciones</div></div><div class="stat card"><div class="label">Ganancia estimada</div><div class="value money">${money(profit)}</div><div class="tiny">Venta − costo</div></div><div class="stat card"><div class="label">Unidades</div><div class="value">${units}</div><div class="tiny">Vendidas</div></div><div class="stat card"><div class="label">Ticket promedio</div><div class="value money">${money(avg)}</div><div class="tiny">Por operación</div></div></div><div class="report-grid"><section class="card section"><h2>Métodos de pago</h2>${pays.map(x=>`<div class="kpi-line"><span>${x[0]}</span><b class="money">${money(x[1])}</b></div>`).join('')}</section><section class="card section"><h2>Por trabajador</h2>${workers.length?workers.map(x=>`<div class="kpi-line"><span>${esc(x[0])}</span><b class="money">${money(x[1])}</b></div>`).join(''):'<div class="empty">Sin ventas.</div>'}</section></div><div class="report-grid"><section class="card section"><h2>Productos más vendidos</h2>${top.length?top.map((p,i)=>{const pct=top[0].total?Math.round(p.total/top[0].total*100):0;return `<div style="padding:7px 0"><div class="kpi-line"><span>#${i+1} ${esc(p.name)}</span><b>${p.qty} · ${money(p.total)}</b></div><div class="bar"><span style="width:${pct}%"></span></div></div>`}).join(''):'<div class="empty">Sin ventas.</div>'}</section><section class="card section"><h2>Ventas recientes</h2><div class="table">${list.slice().reverse().slice(0,20).map(s=>`<div class="table-row"><div><div class="table-title">${esc(s.id)} · ${money(s.total)} ${s.voided?'<span class="badge red">ANULADA</span>':''}</div><div class="table-sub">${fmtDate(s.at)} · ${esc(s.userName)} · ${esc(s.payment)}</div></div>${s.voided?'':'<button class="btn btn-warning" data-void="'+esc(s.id)+'">Anular</button>'}</div>`).join('')||'<div class="empty">Sin ventas.</div>'}</div></section></div>`;$('page').querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>{S.reportRange=b.dataset.range;reports()}));$('csv').addEventListener('click',()=>exportCSV(list));$('page').querySelectorAll('[data-void]').forEach(b=>b.addEventListener('click',()=>voidModal(b.dataset.void)))}
function filteredSales(){const all=S.db.sales,day=dateKey();if(S.reportRange==='today')return all.filter(s=>s.dateKey===day);if(S.reportRange==='7'||S.reportRange==='30'){const d=new Date();d.setDate(d.getDate()-(S.reportRange==='7'?6:29));const start=dateKey(d);return all.filter(s=>s.dateKey>=start&&s.dateKey<=day)}return all}
function voidModal(id){const s=S.db.sales.find(x=>x.id===id&&!x.voided);if(!s)return;openConfirm('Anular venta',`Se marcará la venta ${esc(s.id)} por <b>${money(s.total)}</b> como anulada y se devolverán las existencias al inventario. La acción quedará registrada. ¿Continuar?`,'Anular',()=>voidSale(id),true)}
function voidSale(id){const s=S.db.sales.find(x=>x.id===id&&!x.voided);if(!s)return;for(const i of s.items){const p=S.db.products.find(p=>p.id===i.productId);if(p)p.stock+=i.qty}s.voided=true;s.voidedAt=iso();s.voidedBy=S.user.name;audit('venta_anulada',`${s.id} · ${money(s.total)}`);save();closeModal();reports();toast('Venta anulada y stock restaurado')}
function exportCSV(list){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=[['Fecha','Venta','Trabajador','Pago','Total','Estado'].map(q).join(',')];list.forEach(s=>lines.push([fmtDate(s.at),s.id,s.userName,s.payment,s.total.toFixed(2),s.voided?'Anulada':'Activa'].map(q).join(',')));download(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),'ventas.csv');toast('CSV exportado')}
function admin(){if(!isOwner())return go('home');const valid=S.db.sales.filter(s=>!s.voided),revenue=valid.reduce((a,s)=>a+s.total,0),cost=valid.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0),workers=S.db.users.filter(u=>u.role==='worker');$('page').innerHTML=`<div class="page-head"><div><h1 class="page-title">Administración</h1><p class="page-sub">Negocio, trabajadores, respaldos y auditoría.</p></div></div><div class="stats"><div class="stat card"><div class="label">Ventas acumuladas</div><div class="value money">${money(revenue)}</div></div><div class="stat card"><div class="label">Ganancia estimada</div><div class="value money">${money(revenue-cost)}</div></div><div class="stat card"><div class="label">Trabajadores</div><div class="value">${workers.length}</div></div><div class="stat card"><div class="label">Respaldo</div><div class="value" style="font-size:16px">${localStorage.getItem('gv_last_backup')?'Disponible':'Pendiente'}</div></div></div><div class="grid-2"><section class="card section"><h2>Negocio</h2><div class="brand-row" style="margin-top:10px"><div class="logo-preview">${S.db.store.logo?`<img src="${esc(S.db.store.logo)}" alt="">`:esc(initials(S.db.store.name))}</div><div><div class="table-title">${esc(S.db.store.name)}</div><div class="table-sub">${esc(S.db.store.businessType)} · ${esc(S.db.store.currency)}</div></div></div><button id="business" class="btn btn-light btn-block" style="margin-top:12px">Editar negocio</button></section><section class="card section"><h2>Trabajadores</h2><p class="sm muted">Usuarios separados con PIN. Cada acción queda asociada al trabajador.</p><button id="users" class="btn btn-primary btn-block" style="margin-top:12px">Gestionar trabajadores (${workers.length})</button></section></div><section class="card section"><h2>Datos y respaldo</h2><div class="grid-2"><button id="exportSave" class="btn btn-primary">Exportar respaldo .save</button><label class="btn btn-light" style="cursor:pointer">Importar respaldo<input id="importSave" type="file" accept=".save,application/json" hidden></label></div><div class="modal-note" style="margin-top:10px">Los datos operativos viven en el dispositivo. GitHub solo distribuye la aplicación.</div></section><section class="card section"><h2>Auditoría reciente</h2><div class="table">${S.db.audit.slice().reverse().slice(0,25).map(a=>`<div class="table-row"><div><div class="table-title">${esc(a.action)}</div><div class="table-sub">${fmtDate(a.at)} · ${esc(a.userName)}${a.detail?' · '+esc(a.detail):''}</div></div></div>`).join('')||'<div class="empty">Sin actividad.</div>'}</div></section>`;$('business').addEventListener('click',businessModal);$('users').addEventListener('click',usersModal);$('exportSave').addEventListener('click',exportSave);$('importSave').addEventListener('change',e=>importSave(e.target.files[0]))}
function businessModal(){openModal('Configuración del negocio',`<div class="grid-2"><div class="field"><label>Nombre del negocio</label><input id="bizName" value="${esc(S.db.store.name)}"></div><div class="field"><label>Tipo de negocio</label><input id="bizType" value="${esc(S.db.store.businessType)}"></div></div><div class="grid-2"><div class="field"><label>Moneda / símbolo</label><input id="bizCurrency" maxlength="4" value="${esc(S.db.store.currency)}"></div><div class="field"><label>Teléfono</label><input id="bizPhone" value="${esc(S.db.store.phone)}"></div></div><div class="field"><label>Dirección</label><input id="bizAddress" value="${esc(S.db.store.address)}"></div><div class="field"><label>Logo</label><input id="bizLogo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div class="xs muted">El logo se guarda localmente en este dispositivo.</div></div>`,`Guardar`,saveBusiness)}
function saveBusiness(){const name=$('bizName').value.trim()||'Mi Tienda',type=$('bizType').value.trim()||'Tienda',currency=$('bizCurrency').value.trim()||'$',phone=$('bizPhone').value.trim(),address=$('bizAddress').value.trim(),file=$('bizLogo').files?.[0];const finish=logo=>{S.db.store={...S.db.store,name,businessType:type,currency,phone,address,logo};audit('negocio_actualizado',name);save();closeModal();updateBrand();admin();toast('Configuración guardada')};if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.onerror=()=>toast('No se pudo leer el logo');r.readAsDataURL(file)}else finish(S.db.store.logo)}
function usersModal(){const ws=S.db.users.filter(u=>u.role==='worker');openModal('Trabajadores',`<button id="newUser" class="btn btn-primary" type="button">+ Crear trabajador</button><div class="table" style="margin-top:12px">${ws.map(u=>{const sales=S.db.sales.filter(s=>s.userId===u.id).length;return `<div class="table-row"><div><div class="table-title">${esc(u.name)} ${u.active?'<span class="badge green">Activo</span>':'<span class="badge red">Inactivo</span>'}</div><div class="table-sub">Usuario: ${esc(u.username)} · ${sales} ${sales===1?'venta':'ventas'} históricas</div></div><div class="row-actions"><button class="btn btn-light" data-user-edit="${esc(u.id)}" type="button">Editar</button><button class="btn ${u.active?'btn-warning':'btn-soft'}" data-user-toggle="${esc(u.id)}" type="button">${u.active?'Desactivar':'Activar'}</button><button class="btn btn-danger" data-user-delete="${esc(u.id)}" type="button">Eliminar</button></div></div>`}).join('')||'<div class="empty">No hay trabajadores.</div>'}</div><div class="modal-note" style="margin-top:12px">Eliminar borra el acceso del trabajador. Las ventas y la auditoría conservan el nombre con el que se hicieron.</div>`,`Cerrar`,closeModal);$('newUser').addEventListener('click',()=>userModal());$('modal').querySelectorAll('[data-user-edit]').forEach(b=>b.addEventListener('click',()=>userModal(b.dataset.userEdit)));$('modal').querySelectorAll('[data-user-toggle]').forEach(b=>b.addEventListener('click',()=>toggleUser(b.dataset.userToggle)));$('modal').querySelectorAll('[data-user-delete]').forEach(b=>b.addEventListener('click',()=>confirmDeleteUser(b.dataset.userDelete)))}
function userModal(id){const u=id?S.db.users.find(x=>x.id===id):{name:'',username:'',pin:'',active:true};if(!u)return;const sales=id?S.db.sales.filter(s=>s.userId===id).length:0;openModal(id?'Editar trabajador':'Crear trabajador',`<div class="field"><label>Nombre completo</label><input id="userName" value="${esc(u.name)}" autocomplete="off"></div><div class="field"><label>Usuario</label><input id="userNameLogin" value="${esc(u.username)}" autocomplete="off"></div><div class="field"><label>PIN</label><input id="userPin" type="password" inputmode="numeric" value="${esc(u.pin)}" placeholder="4 a 6 dígitos" autocomplete="new-password"></div><label style="display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800"><input id="userActive" type="checkbox" style="width:20px;min-height:20px" ${u.active?'checked':''}> Usuario activo</label><div class="modal-note">El trabajador puede vender y operar caja. No puede ver costos, ganancias, inventario ni administración.${id?`<br><br>Este trabajador tiene ${sales} ${sales===1?'venta histórica':'ventas históricas'}; eliminar su acceso no borra esas operaciones.`:''}</div>${id?'<button id="deleteUserFromEdit" class="btn btn-danger btn-block" type="button">Eliminar trabajador</button>':''}`,id?'Guardar cambios':'Crear trabajador',()=>saveUser(id));if(id)$('deleteUserFromEdit').addEventListener('click',()=>confirmDeleteUser(id));$('userPin').addEventListener('input',()=>{$('userPin').value=$('userPin').value.replace(/\D/g,'').slice(0,6)})}
function saveUser(id){const name=$('userName').value.trim(),username=$('userNameLogin').value.trim(),pin=$('userPin').value.trim(),active=$('userActive').checked;if(!name||!username||!/^[0-9]{4,6}$/.test(pin))return toast('Nombre, usuario y PIN de 4 a 6 dígitos son obligatorios');if(S.db.users.some(u=>u.id!==id&&u.username.toLowerCase()===username.toLowerCase()))return toast('Ese usuario ya existe');if(id){const u=S.db.users.find(x=>x.id===id&&x.role==='worker');if(!u)return toast('Trabajador no encontrado');u.name=name;u.username=username;u.pin=pin;u.active=active;audit('trabajador_editado',username)}else{S.db.users.push({id:uid('U'),name,username,pin,role:'worker',active});audit('trabajador_creado',username)}save();closeModal();usersModal();toast(id?'Trabajador actualizado':'Trabajador creado')}
function toggleUser(id){const u=S.db.users.find(x=>x.id===id&&x.role==='worker');if(!u)return;u.active=!u.active;audit(u.active?'trabajador_activado':'trabajador_desactivado',u.username);save();usersModal();toast(u.active?'Trabajador activado':'Trabajador desactivado')}
function confirmDeleteUser(id){const u=S.db.users.find(x=>x.id===id&&x.role==='worker');if(!u)return;const sales=S.db.sales.filter(s=>s.userId===id).length;openConfirm('Eliminar trabajador',`Se eliminará el acceso de <b>${esc(u.name)}</b> (${esc(u.username)}). Tiene ${sales} ${sales===1?'venta histórica':'ventas históricas'} que permanecerán en el sistema con su nombre. Esta acción no se puede deshacer salvo restaurando un respaldo.`,'Eliminar',()=>deleteUserNow(id),true)}
function deleteUserNow(id){const idx=S.db.users.findIndex(x=>x.id===id&&x.role==='worker');if(idx<0)return false;const u=S.db.users[idx];S.db.users.splice(idx,1);audit('trabajador_eliminado',`${u.name} · ${u.username}`);save();closeModal();usersModal();toast('Trabajador eliminado');return true}
function exportSave(){const payload={...S.db,exportedAt:iso(),exportedBy:S.user?.name||'Sistema'};download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`${(S.db.store.name||'GestorVentas').replace(/[^a-z0-9_-]+/gi,'_')}_${dateKey()}.save`);localStorage.setItem('gv_last_backup',iso());audit('respaldo_exportado');save();toast('Respaldo .save guardado')}
function importSave(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!parsed||typeof parsed!=='object'||!parsed.store||!Array.isArray(parsed.products)||!Array.isArray(parsed.users))throw new Error();const next=clean(parsed);openConfirm('Importar respaldo','El archivo reemplazará los datos actuales de este dispositivo. La aplicación se recargará después. ¿Continuar?','Importar',()=>{S.db=next;save();location.reload()},true)}catch(e){toast('El archivo .save no es válido')}};r.readAsText(file)}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function openModal(title,body,primary,onPrimary){const back=$('modalBackdrop'),m=$('modal');m.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2><button id="modalX" class="close-btn" aria-label="Cerrar">✕</button></div><div class="modal-body">${body}</div><div class="modal-actions"><button id="modalCancel" class="btn btn-light">Cancelar</button><button id="modalPrimary" class="btn btn-primary">${esc(primary)}</button></div>`;back.classList.add('open');back.setAttribute('aria-hidden','false');$('modalX').addEventListener('click',closeModal);$('modalCancel').addEventListener('click',closeModal);$('modalPrimary').addEventListener('click',()=>onPrimary?.());setTimeout(()=>m.querySelector('input,select')?.focus(),60)}
function closeModal(){$('modalBackdrop').classList.remove('open');$('modalBackdrop').setAttribute('aria-hidden','true');$('modal').innerHTML=''}
function confirmBox(title,body,primary,action,danger=false){openModal(title,`<div class="modal-note">${body}</div>`,primary,()=>{action();closeModal()});if(danger)$('modalPrimary').classList.replace('btn-primary','btn-danger')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(S.toastTimer);S.toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalBackdrop').classList.contains('open'))closeModal()});$('loginBtn').addEventListener('click',login);$('loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginPin').focus()});$('loginPin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('lockBtn').addEventListener('click',lock);$('logoutBtn').addEventListener('click',logout);
load();updateBrand();showLogin();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v='+VERSION,{updateViaCache:'none'}).then(r=>r.update?.()).catch(()=>{})}

// Test interno antes de publicar: /GestorVentas/#selftest
async function selfTest(){const result=[],pass=(n,c)=>result.push((c?'PASS':'FAIL')+' · '+n),oldDb=S.db,oldUser=S.user;try{S.db=base();S.user=S.db.users[0];S.db.cash={open:true,sessionId:'TEST',opening:10,openedAt:iso(),openedBy:'Dueño'};const p=S.db.products[0],initial=p.stock;pass('modelo comercial limpio',Array.isArray(S.db.products)&&Array.isArray(S.db.users)&&Array.isArray(S.db.sales));pass('dueño presente',S.db.users.some(u=>u.role==='owner'));const sale={id:'TEST',at:iso(),dateKey:dateKey(),userId:'owner',userName:'Dueño',payment:'Efectivo',total:p.price,received:p.price,change:0,cashSessionId:'TEST',voided:false,items:[{productId:p.id,name:p.name,price:p.price,cost:p.cost,qty:1}]};S.db.sales.push(sale);p.stock--;pass('venta descuenta stock',p.stock===initial-1);sale.voided=true;p.stock++;pass('deshacer restaura stock',p.stock===initial);S.db.cashMovements.push({id:'M',sessionId:'TEST',type:'in',amount:5,reason:'prueba',at:iso()});pass('caja calcula esperado',cashTotals().expected===15);const before=S.db.users.length;S.db.users.push({id:'W',name:'Test',username:'testu',pin:'1234',role:'worker',active:true});pass('crear trabajador',S.db.users.length===before+1);pass('trabajador es worker',S.db.users.find(u=>u.username==='testu')?.role==='worker');pass('eliminar trabajador',deleteUserNow('W')&&!S.db.users.some(u=>u.id==='W'));const p2=S.db.products[1],salesBefore=S.db.sales.length;const historical={id:'HS',at:iso(),dateKey:dateKey(),userId:'owner',userName:'Dueño',payment:'Tarjeta',total:p2.price,received:0,change:0,cashSessionId:'TEST',voided:false,items:[{productId:p2.id,name:p2.name,price:p2.price,cost:p2.cost,qty:1}]};S.db.sales.push(historical);S.cart=[{productId:p2.id,name:p2.name,price:p2.price,cost:p2.cost,qty:1}];pass('eliminar producto',deleteProductNow(p2.id)&&!S.db.products.some(p=>p.id===p2.id));pass('historial conserva venta',S.db.sales.length===salesBefore+1&&S.db.sales.some(x=>x.id==='HS'));pass('pedido no conserva producto eliminado',!S.cart.some(i=>i.productId===p2.id));historical.voided=true;let missingRestored=0;for(const i of historical.items){const p3=S.db.products.find(p=>p.id===i.productId);if(p3)p3.stock+=i.qty;else missingRestored+=i.qty}pass('anular venta con producto eliminado no rompe inventario',missingRestored===1);pass('productos restantes válidos',S.db.products.every(p=>p.id&&p.name&&Number.isInteger(p.stock)&&Number.isInteger(p.min)));const all=result.every(x=>x.startsWith('PASS'));document.body.innerHTML=`<div style="font:16px system-ui;padding:24px"><h1>GestorVentas self-test</h1><p style="font-size:22px">${all?'✅ PASS':'❌ FAIL'}</p><pre>${result.join('\n')}</pre></div>`}catch(e){result.push('FAIL · excepción: '+(e?.message||e));document.body.innerHTML=`<div style="font:16px system-ui;padding:24px"><h1>GestorVentas self-test</h1><p>❌ FAIL</p><pre>${result.join('\n')}</pre></div>`}finally{S.db=oldDb;S.user=oldUser}}
if(location.hash==='#selftest')selfTest();
</script>
