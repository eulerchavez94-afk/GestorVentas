<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827">
<title>GestorVentas</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--primary:#111827;--accent:#2563eb;--ok:#16a34a;--danger:#dc2626;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}button{border:0;border-radius:14px;padding:13px 16px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
.app{max-width:1100px;margin:auto;padding:14px 14px 90px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px #00000008}
.brand{font-size:22px;font-weight:900}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stack>*{margin-bottom:9px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}.tabs button{background:#fff;border:1px solid var(--border);padding:11px 5px}.tabs .active{background:var(--primary);color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.product{text-align:left;background:#fff;border:1px solid var(--border);min-height:105px}.product strong{display:block;font-size:17px}.price{font-size:18px;font-weight:900;display:block;margin-top:7px}
.btn{background:var(--primary);color:#fff}.blue{background:var(--accent)}.green{background:var(--ok)}.red{background:var(--danger)}.light{background:#f3f4f6;color:#111827}.hidden{display:none}.total{font-size:26px;font-weight:950}.cartline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.qty{display:flex;gap:5px;align-items:center}.qty button{padding:7px 11px;background:#f3f4f6}.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:12px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:16px;padding:12px 16px;z-index:50}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:40}.modalbox{background:#fff;width:100%;max-width:600px;margin:auto 0;padding:18px;border-radius:22px 22px 0 0}
@media(min-width:700px){.modal{align-items:center}.modalbox{border-radius:22px}}
</style></head>
<body>
<div id="login" class="app"><div class="card" style="max-width:430px;margin:12vh auto">
<div class="brand">GestorVentas</div><p class="muted">Punto de venta offline</p>
<div class="stack"><input id="lu" placeholder="Usuario"><input id="lp" type="password" inputmode="numeric" placeholder="PIN"><button class="btn blue" onclick="login()">Entrar</button>
<div class="muted">Demo: dueno / 1234 · trabajador / 1111</div></div></div></div>
<div id="app" class="app hidden"><div class="row card"><div><div id="sn" class="brand">Mi Tienda</div><div id="who" class="muted"></div></div><button class="light" onclick="logout()">Salir</button></div>
<div class="tabs"><button data-t="sale" onclick="tab('sale')">Venta</button><button data-t="inv" onclick="tab('inv')">Inventario</button><button data-t="cash" onclick="tab('cash')">Caja</button><button data-t="cus" onclick="tab('cus')">Clientes</button><button data-t="more" onclick="tab('more')">Más</button></div><div id="content"></div></div>
<div id="modal" class="modal hidden"><div id="mb" class="modalbox"></div></div><div id="toast" class="toast hidden"></div>
<script>
const K='gv_v2';let db=JSON.parse(localStorage.getItem(K)||'null');
if(!db){db={store:{name:'Mi Tienda',currency:'$'},users:[{name:'Dueño',username:'dueno',pin:'1234',role:'owner',active:true},{name:'Trabajador',username:'trabajador',pin:'1111',role:'worker',active:true}],products:[{id:1,name:'Refresco',cost:.7,price:1.5,stock:50,min:10,active:true},{id:2,name:'Cigarro',cost:3,price:5,stock:30,min:5,active:true},{id:3,name:'Picadillo',cost:2,price:3.5,stock:25,min:5,active:true}],sales:[],customers:[],closures:[],cash:{open:false,opening:0,openedBy:''}};save()}
let me=null,cart=[],undo=null,ut=null;
function save(){localStorage.setItem(K,JSON.stringify(db))}function m(n){return db.store.currency+Number(n||0).toFixed(2)}
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){let u=lu.value.trim(),p=lp.value,x=db.users.find(a=>a.username===u&&a.pin===p&&a.active);if(!x)return toast('Usuario o PIN incorrecto');me=x;loginDiv(false);document.getElementById('sn').textContent=db.store.name;document.getElementById('who').textContent=me.name+(me.role==='owner'?' · Dueño':' · Trabajador');tab('sale')}
function loginDiv(on){document.getElementById('login').classList.toggle('hidden',!on);document.getElementById('app').classList.toggle('hidden',on)}
function logout(){me=null;cart=[];loginDiv(true)}
function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));({sale: sale,inv: inventory,cash:cash,cus:customers,more:more}[t])()}
function sale(){document.getElementById('content').innerHTML='<div class="card"><input id="q" placeholder="Buscar producto..." oninput="filter()"></div><div id="plist" class="products"></div><div class="card"><div class="row"><h2>Pedido</h2><button class="light" onclick="cart=[];renderCart()">Vaciar</button></div><div id="cart"></div><div class="row"><b>Total</b><b id="tot" class="total">'+m(0)+'</b></div><div class="grid"><select id="pay"><option>Efectivo</option><option>Tarjeta</option><option>Otro</option><option>Cuenta</option></select><button class="green" onclick="checkout()">COBRAR Y NUEVA VENTA</button></div></div>';filter();renderCart()}
function filter(){let q=(document.getElementById('q')?.value||'').toLowerCase();plist.innerHTML=db.products.filter(p=>p.active&&p.name.toLowerCase().includes(q)).map(p=>'<button class="product" onclick="add('+p.id+')"><strong>'+esc(p.name)+'</strong><span class="price">'+m(p.price)+'</span><span class="muted">Stock: '+p.stock+'</span></button>').join('')}
function add(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('Sin stock');let x=cart.find(a=>a.id===id);if(x)x.qty++;else cart.push({id,qty:1});if(x&&x.qty>p.stock)x.qty=p.stock;renderCart()}
function renderCart(){let e=document.getElementById('cart');if(!e)return;e.innerHTML=cart.length?cart.map(x=>{let p=db.products.find(a=>a.id===x.id);return '<div class="cartline"><div><b>'+esc(p.name)+'</b><div class="muted">'+m(p.price)+' c/u</div></div><div class="qty"><button onclick="chg('+p.id+',-1)">−</button><b>'+x.qty+'</b><button onclick="chg('+p.id+',1)">+</button></div><b>'+m(p.price*x.qty)+'</b></div>'}).join(''):'<p class="muted">Añade productos.</p>';tot.textContent=m(cart.reduce((s,x)=>s+db.products.find(p=>p.id===x.id).price*x.qty,0))}
function chg(id,d){let x=cart.find(a=>a.id===id),p=db.products.find(a=>a.id===id);if(!x)return;x.qty+=d;if(x.qty>p.stock)x.qty=p.stock;if(x.qty<=0)cart=cart.filter(a=>a.id!==id);renderCart()}
function checkout(){if(!cart.length)return toast('Pedido vacío');let items=cart.map(x=>{let p=db.products.find(a=>a.id===x.id);return{id:p.id,name:p.name,qty:x.qty,price:p.price,cost:p.cost}}),total=items.reduce((s,x)=>s+x.qty*x.price,0),s={id:Date.now(),at:new Date().toISOString(),user:me.name,userId:me.username,payment:pay.value,items,total};items.forEach(i=>db.products.find(p=>p.id===i.id).stock-=i.qty);db.sales.push(s);save();cart=[];sale();setUndo(s);toast('Venta registrada · '+m(total))}
function setUndo(s){undo=s;clearTimeout(ut);ut=setTimeout(()=>{undo=null;document.getElementById('undo')?.remove()},15000);let e=document.createElement('div');e.id='undo';e.className='notice';e.style='position:fixed;left:10px;right:10px;bottom:15px;z-index:30';e.innerHTML='<div class="row"><span>Venta #'+s.id+' registrada</span><button class="light" onclick="undoSale()">DESHACER</button></div>';document.body.appendChild(e)}
function undoSale(){if(!undo)return;let s=undo;db.sales=db.sales.filter(x=>x.id!==s.id);s.items.forEach(i=>db.products.find(p=>p.id===i.id).stock+=i.qty);save();undo=null;document.getElementById('undo')?.remove();toast('Venta deshecha; stock restaurado')}
function inventory(){if(me.role!=='owner')return content.innerHTML='<div class="card"><h2>Inventario</h2><p class="muted">Solo el dueño puede administrar inventario.</p></div>';content.innerHTML='<div class="card"><div class="row"><div><h2>Inventario</h2><span class="muted">Costo y ganancia son privados.</span></div><button class="blue" onclick="editProduct()">+ Producto</button></div></div><div class="card">'+db.products.map(p=>'<div class="row" style="padding:12px 0;border-bottom:1px solid #e5e7eb"><span><b>'+esc(p.name)+'</b><br><span class="muted">Precio '+m(p.price)+' · Costo '+m(p.cost)+' · Stock '+p.stock+'</span></span><button class="light" onclick="editProduct('+p.id+')">Editar</button></div>').join('')+'</div>'}
function editProduct(id){let p=id?db.products.find(x=>x.id===id):{name:'',cost:0,price:0,stock:0,min:0};open('<h2>'+(id?'Editar':'Nuevo')+' producto</h2><div class="stack"><input id="pn" placeholder="Nombre" value="'+esc(p.name)+'"><input id="pc" type="number" step=".01" placeholder="Costo" value="'+p.cost+'"><input id="pp" type="number" step=".01" placeholder="Precio de venta" value="'+p.price+'"><input id="ps" type="number" placeholder="Stock" value="'+p.stock+'"><input id="pm" type="number" placeholder="Stock mínimo" value="'+p.min+'"><div class="grid"><button class="light" onclick="closeM()">Cancelar</button><button class="blue" onclick="saveProduct('+(id||0)+')">Guardar</button></div></div>')}
function saveProduct(id){let v={name:pn.value.trim(),cost:+pc.value,price:+pp.value,stock:+ps.value,min:+pm.value};if(!v.name)return toast('Falta nombre');if(id)Object.assign(db.products.find(p=>p.id===id),v);else db.products.push({id:Date.now(),...v,active:true});save();closeM();inventory();toast('Producto guardado')}
function cash(){let cs=db.sales.filter(s=>s.payment==='Efectivo').reduce((a,s)=>a+s.total,0),exp=(db.cash.open?db.cash.opening:0)+cs;content.innerHTML='<div class="card"><h2>Caja</h2>'+(db.cash.open?'<div class="notice"><b>Caja abierta</b><br>Fondo: '+m(db.cash.opening)+'<br>Esperado: '+m(exp)+'</div><button class="red" onclick="closeCash('+exp+')">Cerrar caja</button>':'<p class="muted">Caja cerrada.</p><button class="blue" onclick="openCash()">Abrir caja</button>')+'</div>'}
function openCash(){open('<h2>Abrir caja</h2><input id="op" type="number" step=".01" value="0" placeholder="Fondo inicial"><div class="grid"><button class="light" onclick="closeM()">Cancelar</button><button class="green" onclick="doOpen()">Abrir</button></div>')}
function doOpen(){db.cash={open:true,opening:+op.value,openedBy:me.name};save();closeM();cash()}
function closeCash(e){open('<h2>Cerrar caja</h2><p>Esperado: <b>'+m(e)+'</b></p><input id="co" type="number" step=".01" placeholder="Efectivo contado"><div class="grid"><button class="light" onclick="closeM()">Cancelar</button><button class="red" onclick="doClose('+e+')">Registrar cierre</button></div>')}
function doClose(e){let c=+co.value;db.closures.push({at:new Date().toISOString(),openedBy:db.cash.openedBy,closedBy:me.name,opening:db.cash.opening,expected:e,counted:c,difference:c-e});db.cash={open:false,opening:0,openedBy:''};save();closeM();cash();toast('Cierre registrado')}
function customers(){content.innerHTML='<div class="card"><div class="row"><h2>Clientes</h2><button class="blue" onclick="newCustomer()">+ Cliente</button></div>'+db.customers.map(c=>'<div style="padding:10px 0;border-bottom:1px solid #e5e7eb"><b>'+esc(c.name)+'</b><br><span class="muted">'+esc(c.phone||'')+'</span></div>').join('')+'</div>'}
function newCustomer(){open('<h2>Nuevo cliente</h2><div class="stack"><input id="cn" placeholder="Nombre"><input id="cp" placeholder="Teléfono"><button class="blue" onclick="saveCustomer()">Guardar</button></div>')}
function saveCustomer(){if(!cn.value.trim())return toast('Falta nombre');db.customers.push({id:Date.now(),name:cn.value.trim(),phone:cp.value.trim()});save();closeM();customers()}
function more(){if(me.role!=='owner')return content.innerHTML='<div class="card"><h2>Más</h2><p class="muted">Administración reservada al dueño.</p></div>';let rev=db.sales.reduce((a,s)=>a+s.total,0),cost=db.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0);content.innerHTML='<div class="card"><h2>Resumen del dueño</h2><div class="grid"><div><span class="muted">Ventas</span><div class="total">'+m(rev)+'</div></div><div><span class="muted">Ganancia estimada</span><div class="total">'+m(rev-cost)+'</div></div></div></div><div class="card"><div class="grid"><button class="light" onclick="business()">Negocio</button><button class="light" onclick="users()">Trabajadores</button><button class="blue" onclick="exportSave()">Exportar .save</button><label class="light" style="padding:13px;text-align:center;border-radius:14px;font-weight:700">Importar .save<input type="file" accept=".save" onchange="importSave(this)" hidden></label></div></div><div class="card"><h3>Cierres</h3>'+db.closures.slice().reverse().map(c=>'<div style="padding:9px 0;border-bottom:1px solid #e5e7eb">'+new Date(c.at).toLocaleString()+' · '+esc(c.closedBy)+' · Diferencia <b>'+m(c.difference)+'</b></div>').join('')+'</div>'}
function business(){open('<h2>Configuración del negocio</h2><div class="stack"><input id="bn" value="'+esc(db.store.name)+'" placeholder="Nombre"><input id="bc" value="'+esc(db.store.currency)+'" placeholder="Moneda"><div class="grid"><button class="light" onclick="closeM()">Cancelar</button><button class="blue" onclick="saveBusiness()">Guardar</button></div></div>')}
function saveBusiness(){db.store.name=bn.value.trim()||'Mi Tienda';db.store.currency=bc.value||'$';save();closeM();document.getElementById('sn').textContent=db.store.name;more()}
function users(){open('<h2>Trabajadores</h2><button class="blue" onclick="newUser()">+ Crear usuario</button>'+db.users.filter(u=>u.role==='worker').map(u=>'<div class="row" style="padding:10px 0;border-bottom:1px solid #e5e7eb"><span><b>'+esc(u.name)+'</b><br><span class="muted">'+esc(u.username)+' · '+(u.active?'Activo':'Inactivo')+'</span></span><button class="light" onclick="toggleUser(\''+esc(u.username)+'\')">'+(u.active?'Desactivar':'Activar')+'</button></div>').join(''))}
function newUser(){open('<h2>Crear trabajador/a</h2><div class="stack"><input id="un" placeholder="Nombre"><input id="uu" placeholder="Usuario"><input id="up" type="password" inputmode="numeric" placeholder="PIN"><button class="blue" onclick="saveUser()">Crear</button></div>')}
function saveUser(){if(!un.value.trim()||!uu.value.trim()||!up.value)return toast('Completa los datos');if(db.users.some(x=>x.username===uu.value.trim()))return toast('Usuario ya existe');db.users.push({name:un.value.trim(),username:uu.value.trim(),pin:up.value,role:'worker',active:true});save();users()}
function toggleUser(u){let x=db.users.find(a=>a.username===u);x.active=!x.active;save();users()}
function exportSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download=(db.store.name||'GestorVentas').replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.save';a.click()}
function importSave(i){let f=i.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.store||!x.products||!x.users)throw 0;if(confirm('Reemplazar los datos actuales?')){db=x;save();location.reload()}}catch(e){toast('Archivo no válido')}};r.readAsText(f)}
function open(h){mb.innerHTML=h;modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}
function save(){localStorage.setItem(K,JSON.stringify(db))}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
