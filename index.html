<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>GestorVentas</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#0f172a;--accent:#2563eb;--ok:#16a34a;--danger:#dc2626;--warn:#d97706}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer;min-height:46px;border-radius:13px;padding:11px 15px;font-weight:800}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:var(--text)}
.app{width:min(1180px,100%);margin:auto;padding:14px 14px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #0f172a0a}.brand{font-size:22px;font-weight:950}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stack{display:grid;gap:10px}.hidden{display:none!important}.btn{background:var(--primary);color:#fff}.blue{background:var(--accent);color:#fff}.green{background:var(--ok);color:#fff}.red{background:var(--danger);color:#fff}.light{background:#f8fafc;color:var(--text);border:1px solid var(--line)}.warn{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:10}.tabs button{background:#fff;border:1px solid var(--line);padding:10px 5px;font-size:13px}.tabs .active{background:var(--primary);color:#fff}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.stat b{display:block;font-size:24px;margin-top:4px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.product{text-align:left;background:#fff;border:1px solid var(--line);min-height:112px}.product strong{display:block;font-size:16px}.price{font-size:18px;font-weight:950;display:block;margin-top:7px}.low{border-color:#fdba74;background:#fffaf5}.total{font-size:28px;font-weight:950}.cartline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:5px;align-items:center}.qty button{min-height:38px;padding:6px 11px;background:#f1f5f9}.notice{padding:12px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:14px}.dangerbox{padding:12px;border:1px solid #fecaca;background:#fef2f2;border-radius:14px}.empty{padding:22px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#02061799;display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:100}.modal.hidden{display:none}.modalbox{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.modalhead h2{margin:0;font-size:20px}.close{min-width:44px;padding:8px;border-radius:12px;background:#f1f5f9}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:14px;padding:12px 16px;z-index:200;box-shadow:0 10px 30px #0004;max-width:calc(100% - 30px);text-align:center}.undo{position:fixed;left:12px;right:12px;bottom:14px;z-index:90;background:#fff;border:1px solid #bfdbfe;border-radius:16px;padding:11px;box-shadow:0 12px 30px #0002}
.tablelike>div{padding:11px 0;border-bottom:1px solid var(--line)}
@media(min-width:700px){.app{padding-top:22px}.modal{align-items:center;padding:20px}.modalbox{border-radius:22px}.modalactions{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.tabs{grid-template-columns:repeat(3,1fr)}.statgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.cartline{grid-template-columns:1fr auto}.cartline>strong:last-child{grid-column:2}.modalactions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="login" class="app">
  <div class="card" style="max-width:430px;margin:12vh auto">
    <div class="brand">GestorVentas</div><p class="muted">Punto de venta offline</p>
    <div class="stack">
      <input id="loginUser" autocomplete="username" placeholder="Usuario">
      <input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
      <button id="loginBtn" class="blue">Entrar</button>
      <div class="muted">Demo: <b>dueno / 1234</b> · trabajador / 1111</div>
    </div>
  </div>
</section>

<section id="app" class="app hidden">
  <header class="card row">
    <div><div id="storeName" class="brand">Mi Tienda</div><div id="who" class="muted"></div></div>
    <button id="logoutBtn" class="light">Salir</button>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <main id="content"></main>
</section>

<div id="modal" class="modal hidden" aria-hidden="true">
  <div id="modalBox" class="modalbox" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast hidden"></div>
<div id="undoBar" class="undo hidden"></div>

<script>
'use strict';
const KEY='gv_v22';
const OLD_KEY='gv_v2';
const $=id=>document.getElementById(id);
let db=null, me=null, cart=[], lastSale=null, undoTimer=null, currentTab='home', modalAction=null;

function defaults(){return {version:22,store:{name:'Mi Tienda',currency:'$'},users:[{id:'owner',name:'Dueño',username:'dueno',pin:'1234',role:'owner',active:true},{id:'worker-demo',name:'Trabajador',username:'trabajador',pin:'1111',role:'worker',active:true}],products:[{id:'p1',name:'Refresco',cost:.70,price:1.50,stock:50,min:10,active:true},{id:'p2',name:'Cigarro',cost:3,price:5,stock:30,min:5,active:true},{id:'p3',name:'Picadillo',cost:2,price:3.50,stock:25,min:5,active:true}],sales:[],customers:[],closures:[],inventoryClosures:[],audit:[],cash:{open:false,sessionId:null,opening:0,openedAt:null,openedBy:null}}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)db=JSON.parse(raw);else{const old=localStorage.getItem(OLD_KEY);db=old?migrate(JSON.parse(old)):defaults();save()}normalize()}catch(e){db=defaults();save()}}
function migrate(x){const d=defaults();Object.assign(d,x||{});d.version=22;d.audit=d.audit||[];d.inventoryClosures=d.inventoryClosures||[];d.cash=d.cash||defaults().cash;return d}
function normalize(){db.users=(db.users||[]).map(u=>({...u,id:u.id||u.username}));db.products=db.products||[];db.sales=db.sales||[];db.customers=db.customers||[];db.closures=db.closures||[];db.inventoryClosures=db.inventoryClosures||[];db.audit=db.audit||[];db.store=db.store||{name:'Mi Tienda',currency:'$'};db.cash=db.cash||defaults().cash}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return (db.store.currency||'$')+Number(n||0).toFixed(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2200)}
function audit(action,detail){db.audit.push({id:Date.now()+Math.random(),at:new Date().toISOString(),user:me?.username||'sistema',name:me?.name||'sistema',action,detail});if(db.audit.length>1000)db.audit=db.audit.slice(-1000)}
function canOwner(){return me?.role==='owner'}
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('storeName').textContent=db.store.name; $('who').textContent=me.name+' · '+(canOwner()?'Dueño':'Trabajador'); buildTabs(); go('home') }
function showLogin(){me=null;cart=[];$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginUser').focus()}
function login(){const u=$('loginUser').value.trim(),p=$('loginPin').value;const user=db.users.find(x=>x.username===u&&x.pin===p&&x.active);if(!user){toast('Usuario o PIN incorrecto');return}me=user;audit('inicio_sesion','');save();showApp()}
function logout(){closeModal();showLogin()}
function buildTabs(){const tabs=canOwner()?[['home','Inicio'],['sale','Venta'],['inv','Inventario'],['cash','Caja'],['cus','Clientes'],['admin','Administración']]:[['home','Inicio'],['sale','Venta'],['cash','Caja'],['cus','Clientes']];$('tabs').innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}">${label}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)))}
function go(t){currentTab=t;$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({home:home,sale:sale,inv:inventory,cash:cash, cus:customers,admin:admin}[t]||home)()}
function home(){const today=new Date().toISOString().slice(0,10),sales=db.sales.filter(s=>s.at.startsWith(today)),units=sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0),low=db.products.filter(p=>p.active&&p.stock<=p.min).length; $('content').innerHTML=`<div class="statgrid"><div class="stat"><span class="muted">Ventas hoy</span><b>${money(sales.reduce((a,s)=>a+s.total,0))}</b></div><div class="stat"><span class="muted">Unidades vendidas</span><b>${units}</b></div><div class="stat"><span class="muted">Stock bajo</span><b>${low}</b></div></div><div class="card"><h2>Accesos rápidos</h2><div class="grid"><button class="blue" data-go="sale">Nueva venta</button>${canOwner()?'<button class="light" data-go="inv">Inventario</button>':''}<button class="light" data-go="cash">Caja</button><button class="light" data-go="cus">Clientes</button></div></div>`;$('content').querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)))}
function sale(){cart=[];renderSale()}
function renderSale(){const q=($('saleSearch')?.value||'').toLowerCase();$('content').innerHTML=`<div class="card"><div class="row"><div><h2 style="margin:0">Nueva venta</h2><span class="muted">Toca un producto para añadirlo.</span></div><button id="clearCart" class="light">Vaciar</button></div><div style="margin-top:10px"><input id="saleSearch" placeholder="Buscar producto..." value="${esc(q)}"></div></div><div id="productList" class="products"></div><div class="card"><div class="row"><b>Total</b><b id="saleTotal" class="total">${money(0)}</b></div><div id="cartList"></div><div class="grid" style="margin-top:12px"><select id="payment"><option>Efectivo</option><option>Tarjeta</option><option>Otro</option><option>Cuenta</option></select><button id="checkout" class="green">COBRAR Y NUEVA VENTA</button></div></div>`;$('saleSearch').addEventListener('input',renderProducts);$('clearCart').addEventListener('click',()=>{cart=[];renderSale()});$('checkout').addEventListener('click',checkout);renderProducts();renderCart()}
function renderProducts(){const q=($('saleSearch')?.value||'').toLowerCase();const arr=db.products.filter(p=>p.active&&p.name.toLowerCase().includes(q));$('productList').innerHTML=arr.length?arr.map(p=>`<button class="product ${p.stock<=p.min?'low':''}" data-product="${p.id}"><strong>${esc(p.name)}</strong><span class="price">${money(p.price)}</span><span class="muted">Stock: ${p.stock}</span></button>`).join(''):'<div class="card empty">No hay productos.</div>';$('productList').querySelectorAll('[data-product]').forEach(b=>b.addEventListener('click',()=>addToCart(b.dataset.product)))}
function addToCart(id){const p=db.products.find(x=>String(x.id)===String(id));if(!p||!p.active)return;if(p.stock<=0)return toast('Sin stock');const line=cart.find(x=>String(x.id)===String(id));if(line){if(line.qty>=p.stock)return toast('No hay más unidades disponibles');line.qty++}else cart.push({id:p.id,qty:1});renderCart()}
function changeQty(id,delta){const line=cart.find(x=>String(x.id)===String(id)),p=db.products.find(x=>String(x.id)===String(id));if(!line||!p)return;line.qty+=delta;if(line.qty>p.stock)line.qty=p.stock;if(line.qty<=0)cart=cart.filter(x=>String(x.id)!==String(id));renderCart()}
function cartTotal(){return cart.reduce((sum,l)=>{const p=db.products.find(x=>String(x.id)===String(l.id));return sum+(p?p.price*l.qty:0)},0)}
function renderCart(){if(!$('cartList'))return;const total=cartTotal();$('saleTotal').textContent=money(total);$('cartList').innerHTML=cart.length?cart.map(l=>{const p=db.products.find(x=>String(x.id)===String(l.id));return `<div class="cartline"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} c/u</div></div><div class="qty"><button data-minus="${p.id}">−</button><b>${l.qty}</b><button data-plus="${p.id}">+</button></div><strong>${money(p.price*l.qty)}</strong></div>`}).join(''):'<div class="empty">Añade productos al pedido.</div>';$('cartList').querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.minus,-1)));$('cartList').querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.plus,1)))}
function checkout(){if(!cart.length)return toast('El pedido está vacío');const items=cart.map(l=>{const p=db.products.find(x=>String(x.id)===String(l.id));return{id:p.id,name:p.name,qty:l.qty,price:p.price,cost:p.cost}});if(items.some(i=>{const p=db.products.find(x=>String(x.id)===String(i.id));return !p||p.stock<i.qty}))return toast('El stock cambió. Revisa el pedido.');const total=items.reduce((a,i)=>a+i.price*i.qty,0),s={id:'S'+Date.now(),at:new Date().toISOString(),user:me.name,userId:me.username,payment:$('payment').value,items,total};items.forEach(i=>db.products.find(p=>String(p.id)===String(i.id)).stock-=i.qty);db.sales.push(s);audit('venta',`Venta ${s.id} · ${money(total)} · ${s.payment}`);save();cart=[];showUndo(s);renderSale();toast('Venta registrada · '+money(total))}
function showUndo(s){clearTimeout(undoTimer);lastSale=s;$('undoBar').innerHTML=`<div class="row"><span>Venta registrada · ${money(s.total)}</span><button id="undoBtn" class="light">DESHACER</button></div>`;$('undoBar').classList.remove('hidden');$('undoBtn').addEventListener('click',undoLastSale);undoTimer=setTimeout(()=>{lastSale=null;$('undoBar').classList.add('hidden')},15000)}
function undoLastSale(){if(!lastSale)return;const s=db.sales.find(x=>x.id===lastSale.id);if(!s)return;for(const i of s.items){const p=db.products.find(x=>String(x.id)===String(i.id));if(p)p.stock+=i.qty}db.sales=db.sales.filter(x=>x.id!==s.id);audit('venta_deshacida',`Venta ${s.id}`);save();lastSale=null;clearTimeout(undoTimer);$('undoBar').classList.add('hidden');renderSale();toast('Venta deshecha y stock restaurado')}
function inventory(){if(!canOwner())return go('home');$('content').innerHTML=`<div class="card"><div class="row"><div><h2 style="margin:0">Inventario</h2><span class="muted">Costos y márgenes solo para el dueño.</span></div><button id="newProduct" class="blue">+ Producto</button></div></div><div class="card tablelike">${db.products.length?db.products.map(p=>`<div class="row"><span><b>${esc(p.name)}</b><br><span class="muted">Precio ${money(p.price)} · Costo ${money(p.cost)} · Stock ${p.stock} · Mín. ${p.min}</span></span><button class="light" data-edit="${p.id}">Editar</button></div>`).join(''):'<div class="empty">No hay productos.</div>'}</div><div class="card"><h3>Cierre de inventario</h3><p class="muted">Cuenta físicamente las existencias y registra diferencias.</p><button id="inventoryClose" class="light">Hacer conteo físico</button></div>`;$('newProduct').addEventListener('click',()=>productModal());$('content').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>productModal(b.dataset.edit)));$('inventoryClose').addEventListener('click',inventoryCountModal)}
function productModal(id){const p=id?db.products.find(x=>String(x.id)===String(id)):{name:'',cost:0,price:0,stock:0,min:0,active:true};modalAction=()=>saveProduct(id);openModal(id?'Editar producto':'Nuevo producto',`<div class="stack"><input id="fName" placeholder="Nombre" value="${esc(p.name)}"><input id="fCost" type="number" step="0.01" placeholder="Costo" value="${p.cost}"><input id="fPrice" type="number" step="0.01" placeholder="Precio de venta" value="${p.price}"><input id="fStock" type="number" step="1" placeholder="Stock" value="${p.stock}"><input id="fMin" type="number" step="1" placeholder="Stock mínimo" value="${p.min}"><label class="muted"><input id="fActive" type="checkbox" ${p.active!==false?'checked':''} style="width:auto;margin-right:8px"> Producto activo</label></div>`,`Guardar`,`saveProduct('${id||''}')`)}
function saveProduct(id){const name=$('fName').value.trim(),cost=Number($('fCost').value),price=Number($('fPrice').value),stock=Number($('fStock').value),min=Number($('fMin').value),active=$('fActive').checked;if(!name)return toast('Falta el nombre');if([cost,price,stock,min].some(n=>!Number.isFinite(n)||n<0))return toast('Revisa los valores');if(id){const p=db.products.find(x=>String(x.id)===String(id));Object.assign(p,{name,cost,price,stock,min,active});audit('producto_editado',name)}else{db.products.push({id:'P'+Date.now(),name,cost,price,stock,min,active});audit('producto_creado',name)}save();closeModal();inventory();toast('Producto guardado')}
function inventoryCountModal(){const rows=db.products.filter(p=>p.active).map(p=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(p.name)}<br><span class="muted">Teórico: ${p.stock}</span></span><input data-count="${p.id}" type="number" min="0" step="1" value="${p.stock}" style="max-width:120px"></div>`).join('');modalAction=saveInventoryCount;openModal('Conteo físico',`<div>${rows}</div><p class="muted">Al registrar se guardará el conteo y las diferencias.</p>`,`Registrar conteo`)}
function saveInventoryCount(){const counts=[...document.querySelectorAll('[data-count]')].map(e=>({id:e.dataset.count,physical:Number(e.value)}));if(counts.some(x=>!Number.isFinite(x.physical)||x.physical<0))return toast('Revisa las cantidades');const diff=counts.map(c=>{const p=db.products.find(x=>String(x.id)===String(c.id));return{name:p.name,theoretical:p.stock,physical:c.physical,difference:c.physical-p.stock}});db.inventoryClosures.push({id:'IC'+Date.now(),at:new Date().toISOString(),user:me.name,items:diff});diff.forEach(d=>{const p=db.products.find(x=>x.name===d.name);p.stock=d.physical});audit('cierre_inventario',`Productos contados: ${diff.length}`);save();closeModal();inventory();toast('Conteo registrado')}
function cash(){const open=db.cash.open;const sessionSales=open?db.sales.filter(s=>s.cashSessionId===db.cash.sessionId):[];const cashSales=sessionSales.filter(s=>s.payment==='Efectivo').reduce((a,s)=>a+s.total,0),card=sessionSales.filter(s=>s.payment==='Tarjeta').reduce((a,s)=>a+s.total,0),other=sessionSales.filter(s=>s.payment!=='Efectivo'&&s.payment!=='Tarjeta').reduce((a,s)=>a+s.total,0),expected=Number(db.cash.opening||0)+cashSales;$('content').innerHTML=`<div class="card"><h2>Caja</h2>${open?`<div class="notice"><b>Caja abierta</b><br>Fondo inicial: ${money(db.cash.opening)}<br>Efectivo vendido: ${money(cashSales)}<br><b>Efectivo esperado: ${money(expected)}</b></div><div class="grid" style="margin-top:10px"><div class="stat"><span class="muted">Tarjeta</span><b>${money(card)}</b></div><div class="stat"><span class="muted">Otros / Cuenta</span><b>${money(other)}</b></div></div><button id="closeCash" class="red" style="margin-top:10px;width:100%">Cerrar caja</button>`:'<div class="empty">La caja está cerrada.</div><button id="openCash" class="blue" style="width:100%">Abrir caja</button>'}</div>${db.closures.length?`<div class="card"><h3>Últimos cierres</h3><div class="tablelike">${db.closures.slice().reverse().slice(0,10).map(c=>`<div>${new Date(c.at).toLocaleString()} · ${esc(c.closedBy)} · Diferencia <b>${money(c.difference)}</b></div>`).join('')}</div></div>`:''}`;if(open)$('closeCash').addEventListener('click',()=>closeCashModal(expected));else $('openCash').addEventListener('click',openCashModal)}
function openCashModal(){modalAction=doOpenCash;openModal('Abrir caja',`<div class="stack"><input id="fOpening" type="number" min="0" step="0.01" value="0" placeholder="Fondo inicial"></div>`,`Abrir caja`)}
function doOpenCash(){const opening=Number($('fOpening').value);if(!Number.isFinite(opening)||opening<0)return toast('Fondo inválido');if(db.cash.open)return toast('La caja ya está abierta');db.cash={open:true,sessionId:'C'+Date.now(),opening,openedAt:new Date().toISOString(),openedBy:me.name};audit('caja_abierta',`Fondo ${money(opening)}`);save();closeModal();cash();toast('Caja abierta')}
function closeCashModal(expected){modalAction=()=>doCloseCash(expected);openModal('Cerrar caja',`<div class="notice">Efectivo esperado: <b>${money(expected)}</b></div><div class="stack" style="margin-top:10px"><input id="fCounted" type="number" min="0" step="0.01" placeholder="Efectivo contado"></div>`,`Registrar cierre`)}
function doCloseCash(expected){const counted=Number($('fCounted').value);if(!Number.isFinite(counted)||counted<0)return toast('Escribe el efectivo contado');const diff=counted-expected;db.closures.push({id:'CC'+Date.now(),at:new Date().toISOString(),openedBy:db.cash.openedBy,closedBy:me.name,opening:db.cash.opening,expected,counted,difference:diff,sessionId:db.cash.sessionId});audit('caja_cerrada',`Esperado ${money(expected)} · Contado ${money(counted)} · Diferencia ${money(diff)}`);db.cash={open:false,sessionId:null,opening:0,openedAt:null,openedBy:null};save();closeModal();cash();toast('Cierre registrado')}
function customers(){ $('content').innerHTML=`<div class="card"><div class="row"><div><h2 style="margin:0">Clientes</h2><span class="muted">Registro básico de clientes.</span></div><button id="newCustomer" class="blue">+ Cliente</button></div></div><div class="card tablelike">${db.customers.length?db.customers.map(c=>`<div><b>${esc(c.name)}</b><br><span class="muted">${esc(c.phone||'')}</span></div>`).join(''):'<div class="empty">No hay clientes registrados.</div>'}</div>`;$('newCustomer').addEventListener('click',customerModal)}
function customerModal(){modalAction=saveCustomer;openModal('Nuevo cliente',`<div class="stack"><input id="fCustomerName" placeholder="Nombre"><input id="fCustomerPhone" placeholder="Teléfono"></div>`,`Guardar`)}
function saveCustomer(){const name=$('fCustomerName').value.trim(),phone=$('fCustomerPhone').value.trim();if(!name)return toast('Falta el nombre');db.customers.push({id:'CL'+Date.now(),name,phone});audit('cliente_creado',name);save();closeModal();customers();toast('Cliente guardado')}
function admin(){if(!canOwner())return go('home');const revenue=db.sales.reduce((a,s)=>a+s.total,0),cost=db.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0);$('content').innerHTML=`<div class="card"><h2>Administración</h2><div class="statgrid"><div class="stat"><span class="muted">Ventas acumuladas</span><b>${money(revenue)}</b></div><div class="stat"><span class="muted">Ganancia estimada</span><b>${money(revenue-cost)}</b></div><div class="stat"><span class="muted">Trabajadores</span><b>${db.users.filter(u=>u.role==='worker').length}</b></div></div></div><div class="card"><div class="grid"><button id="businessBtn" class="light">Negocio</button><button id="usersBtn" class="light">Trabajadores</button><button id="exportBtn" class="blue">Exportar .save</button><label class="light" style="display:flex;align-items:center;justify-content:center">Importar .save<input id="importFile" type="file" accept=".save,application/json" hidden></label></div></div><div class="card"><h3>Actividad reciente</h3><div class="tablelike">${db.audit.slice().reverse().slice(0,12).map(a=>`<div><b>${esc(a.action)}</b><br><span class="muted">${new Date(a.at).toLocaleString()} · ${esc(a.name)} · ${esc(a.detail)}</span></div>`).join('')||'<div class="empty">Sin actividad.</div>'}</div></div>`;$('businessBtn').addEventListener('click',businessModal);$('usersBtn').addEventListener('click',usersModal);$('exportBtn').addEventListener('click',exportSave);$('importFile').addEventListener('change',e=>importSave(e.target.files[0]))}
function businessModal(){modalAction=saveBusiness;openModal('Configuración del negocio',`<div class="stack"><input id="fBusinessName" value="${esc(db.store.name)}" placeholder="Nombre del negocio"><input id="fCurrency" value="${esc(db.store.currency)}" placeholder="Símbolo de moneda"></div>`,`Guardar`)}
function saveBusiness(){const name=$('fBusinessName').value.trim()||'Mi Tienda',currency=$('fCurrency').value.trim()||'$';db.store={...db.store,name,currency};audit('negocio_actualizado',name);save();$('storeName').textContent=name;closeModal();admin();toast('Configuración guardada')}
function usersModal(){const list=db.users.filter(u=>u.role==='worker');modalAction=closeModal;openModal('Trabajadores',`<div class="stack"><button id="newUserBtn" class="blue">+ Crear trabajador</button><div class="tablelike">${list.length?list.map(u=>`<div class="row"><span><b>${esc(u.name)}</b><br><span class="muted">${esc(u.username)} · ${u.active?'Activo':'Inactivo'}</span></span><button class="light" data-toggle-user="${esc(u.id)}">${u.active?'Desactivar':'Activar'}</button></div>`).join(''):'<div class="empty">No hay trabajadores creados.</div>'}</div></div>`,`Cerrar`);$('newUserBtn').addEventListener('click',newUserModal);$('modalBox').querySelectorAll('[data-toggle-user]').forEach(b=>b.addEventListener('click',()=>toggleUser(b.dataset.toggleUser)))}
function newUserModal(){modalAction=saveUser;openModal('Crear trabajador',`<div class="stack"><input id="fUserName" placeholder="Nombre completo"><input id="fUsername" placeholder="Usuario"><input id="fUserPin" type="password" inputmode="numeric" placeholder="PIN"><div class="muted">El PIN lo utilizará el trabajador para entrar.</div></div>`,`Crear`)}
function saveUser(){const name=$('fUserName').value.trim(),username=$('fUsername').value.trim(),pin=$('fUserPin').value.trim();if(!name||!username||!pin)return toast('Completa nombre, usuario y PIN');if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast('Ese usuario ya existe');const u={id:'U'+Date.now(),name,username,pin,role:'worker',active:true};db.users.push(u);audit('trabajador_creado',username);save();closeModal();usersModal();toast('Trabajador creado')}
function toggleUser(id){const u=db.users.find(x=>String(x.id)===String(id));if(!u)return;u.active=!u.active;audit(u.active?'trabajador_activado':'trabajador_desactivado',u.username);save();usersModal();toast(u.active?'Trabajador activado':'Trabajador desactivado')}
function exportSave(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(db.store.name||'GestorVentas').replace(/[^a-z0-9_-]+/gi,'_')+'_'+new Date().toISOString().slice(0,10)+'.save';a.click();URL.revokeObjectURL(a.href);toast('Copia guardada')}
function importSave(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x.store||!Array.isArray(x.products)||!Array.isArray(x.users))throw new Error();if(!confirm('Esto reemplazará los datos actuales. ¿Continuar?'))return;db=migrate(x);save();location.reload()}catch(e){toast('Archivo .save no válido')}};reader.readAsText(file)}
function openModal(title,body,primaryLabel){const box=$('modalBox');box.innerHTML=`<div class="modalhead"><h2>${esc(title)}</h2><button id="modalX" class="close" aria-label="Cerrar">✕</button></div>${body}<div class="modalactions"><button id="modalCancel" class="light">Cancelar</button><button id="modalPrimary" class="blue">${esc(primaryLabel)}</button></div>`;$('modal').classList.remove('hidden');$('modal').setAttribute('aria-hidden','false');$('modalX').addEventListener('click',closeModal);$('modalCancel').addEventListener('click',closeModal);$('modalPrimary').addEventListener('click',()=>{if(modalAction)modalAction()})}
function closeModal(){modalAction=null;$('modal').classList.add('hidden');$('modal').setAttribute('aria-hidden','true');$('modalBox').innerHTML=''}

$('loginBtn').addEventListener('click',login);$('loginPin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginPin').focus()});$('logoutBtn').addEventListener('click',logout);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
load();showLogin();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=4',{updateViaCache:'none'}).catch(()=>{})}
</script>
</body></html>
